<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'"
    />
    <title>CastKit settings</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <main>
      <section aria-labelledby="server-heading">
        <h1 id="server-heading">CastKit server</h1>
        <form id="server-form">
          <label for="server-origin">Server address</label>
          <input
            id="server-origin"
            name="serverOrigin"
            placeholder="http://castkit.local:8788"
            autocomplete="off"
            required
          />
          <button type="submit">Save</button>
          <p class="status" id="server-status" role="status"></p>
        </form>
      </section>

      <section aria-labelledby="window-heading">
        <h2 id="window-heading">Add window</h2>
        <form id="window-form">
          <label for="window-page">Page</label>
          <input
            id="window-page"
            name="page"
            placeholder="/screen/&lt;id&gt;, /view/&lt;id&gt;, or /d/&lt;id&gt;"
            autocomplete="off"
            required
          />
          <fieldset class="targets" id="window-targets">
            <legend>Pages on this server</legend>
          </fieldset>
          <fieldset id="window-display">
            <legend>Display</legend>
          </fieldset>
          <label class="checkbox">
            <input id="window-fullscreen" name="isFullScreen" type="checkbox" checked />
            Fullscreen
          </label>
          <button type="submit">Add window</button>
          <p class="status" id="window-status" role="status"></p>
        </form>
      </section>
    </main>
    <script src="settingsPage.js"></script>
  </body>
</html>
