# SQFMI Watchy v3: a local clock and a CastKit image page.
# Install with a wrapper overriding the substitutions and providing secrets.
# The watch carries no points rules or child identity: configure its CastKit channel.
substitutions:
  node_name: watchy
  friendly_name: Watchy Display
  device_id: watchy
  topic_base: castkit
  timezone: UTC
  agenda_state_topic: ${topic_base}/${device_id}/agenda/set
  binary_clock_enabled: 'false'
  scores_enabled: 'false'
  scores_state_topic: ${topic_base}/${device_id}/scores/set
  timer_state_topic: ${topic_base}/${device_id}/timer/state
  battery_sync_minutes: '1'
  scores_expected_count: '0'
  state_refresh_topic: ''
  active_timer_sync_minutes: '1'

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.1
  includes:
    - <esp_wifi.h>
  on_boot:
    - priority: 1000
      then:
        - lambda: |-
            id(boot_wake_cause) = esp_sleep_get_wakeup_cause();
            id(boot_button_mask) = esp_sleep_get_ext1_wakeup_status();
            id(boot_reset_reason) = esp_reset_reason();
            if (id(boot_reset_reason) != ESP_RST_DEEPSLEEP) {
              watchy::network_retry = {};
              watchy::hold_motor_off();
            }
            watchy::configure_cpu();
    - priority: 600
      then:
        - lambda: |-
            // The accelerometer is unused. Its state survives deep sleep, so set it once.
            if (id(boot_reset_reason) != ESP_RST_DEEPSLEEP) {
              struct Bus {
                i2c::I2CBus *bus;
                bool read_register(uint8_t address, uint8_t reg, uint8_t &value) {
                  return bus->write_readv(address, &reg, 1, &value, 1) == i2c::ERROR_OK;
                }
                bool write_register(uint8_t address, uint8_t reg, uint8_t value) {
                  const uint8_t bytes[2] = {reg, value};
                  return bus->write(address, bytes, 2) == i2c::ERROR_OK;
                }
              } bus{id(sensor_bus)};
              watchy::accel_state = watchy::suspend_bma423(bus, [](uint32_t ms) { delay(ms); });
              ESP_LOGI("watchy_power", "Accelerometer: %s", watchy::accel_state_text(watchy::accel_state));
            }
            if (id(boot_reset_reason) == ESP_RST_DEEPSLEEP) {
              const auto &saved = watchy::runtime_cache;
              id(agenda_cache) = saved.agenda;
              id(scores_cache) = saved.scores;
              id(timer_cache) = saved.timer;
              id(agenda_page) = saved.agenda_page;
              id(scores_page) = saved.scores_page;
              id(is_binary_clock) = saved.binary;
              id(is_agenda_page) = saved.agenda_selected;
              id(is_scores_page) = saved.scores_selected;
              id(is_points_page) = saved.image_selected;
              id(is_timer_page) = saved.timer_selected;
            }
            ESP_LOGI("watchy", "Restored scores for %s: %u entries", id(scores_cache).day, id(scores_cache).count);
            ESP_LOGI("watchy", "Restored agenda for %s: %u events", id(agenda_cache).day, id(agenda_cache).count);
            const uint64_t buttons = id(boot_button_mask);
            if (buttons) id(last_button_at) = millis();
            if (buttons & (1ULL << 0)) id(cycle_agenda).execute();
            if (buttons & (1ULL << 7)) id(cycle_clock).execute();
            if (buttons & (1ULL << 8)) id(cycle_scores).execute();
            id(is_timer_sync_requested) = bool(buttons & (1ULL << 6));
            if (buttons & (1ULL << 6)) {
              id(is_binary_clock) = ${binary_clock_enabled};
              id(is_timer_page) = false;
              id(is_scores_page) = false;
              id(is_points_page) = false;
              id(is_agenda_page) = false;
            }
            if (id(is_agenda_page) || id(is_scores_page) || id(is_points_page) || id(is_timer_page))
              id(is_binary_clock) = false;
    - priority: -100
      then:
        - component.update: wake_reason
        - component.update: accelerometer_state
        - component.update: clock_wake_duration
        - component.update: sync_wake_duration
        - component.update: battery_voltage
        - lambda: |-
            auto now = id(watch_time).now();
            id(network_this_wake) = watchy::network_due({
              id(usb_connected).state, bool(id(boot_button_mask) & (1ULL << 6)),
              id(boot_reset_reason) != ESP_RST_DEEPSLEEP, now.is_valid(), now.minute,
              ${battery_sync_minutes}, now.timestamp, watchy::timer_running(id(timer_cache)),
              ${active_timer_sync_minutes}}, watchy::network_retry);
            // View buttons draw cached data without starting the radio.
            if (id(boot_wake_cause) == ESP_SLEEP_WAKEUP_EXT1 && !(id(boot_button_mask) & (1ULL << 6))
                && !id(usb_connected).state && now.is_valid()) id(network_this_wake) = false;
        - component.update: watch_display
        - if:
            condition:
              lambda: return bool(id(boot_button_mask) & (1ULL << 7));
            then:
              - script.execute: sync_if_menu_held
        - if:
            condition:
              lambda: return id(network_this_wake);
            then:
              - lambda: watchy::boost_cpu(true);
              - wifi.enable:
              - script.execute: connect_mqtt
              - script.execute: battery_cycle
            else:
              - script.execute: sleep_until_minute

  on_shutdown:
    - priority: 700
      then:
        - lambda: |-
            auto &saved = watchy::runtime_cache;
            saved.agenda = id(agenda_cache);
            saved.scores = id(scores_cache);
            saved.timer = id(timer_cache);
            saved.agenda_page = id(agenda_page);
            saved.scores_page = id(scores_page);
            saved.binary = id(is_binary_clock);
            saved.agenda_selected = id(is_agenda_page);
            saved.scores_selected = id(is_scores_page);
            saved.image_selected = id(is_points_page);
            saved.timer_selected = id(is_timer_page);

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 8MB
  # Boot and draw at 80 MHz; network work holds 160 MHz through a power-management lock.
  cpu_frequency: 80MHZ
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_PM_ENABLE: y
      CONFIG_RTC_CLK_SRC_EXT_CRYS: y
      CONFIG_MBEDTLS_HARDWARE_MPI: y
      CONFIG_MBEDTLS_LARGE_KEY_SOFTWARE_MPI: y

external_components:
  - source:
      type: local
      path: components
    components: [watchy_battery, watchy_display]

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  enable_on_boot: false
  # Flash storage lets the package forget a weak access point by its key. ESPHome
  # writes it only when the access point changes, never on an unchanged wake.
  fast_connect:
    enabled: true
    storage: flash
  # Finish short battery transfers quickly; USB uses modem sleep while connected.
  power_save_mode: NONE
  on_connect:
    - lambda: |-
        esp_wifi_set_ps(id(usb_connected).state ? WIFI_PS_MIN_MODEM : WIFI_PS_NONE);
    - script.execute: connect_mqtt
  on_disconnect:
    - mqtt.disable:
        id: mqtt_client
    - lambda: watchy::boost_cpu(false);
  reboot_timeout: 0s
  ap:
    password: !secret ap_fallback_password

captive_portal:

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key
  actions:
    - action: set_time
      variables:
        timestamp: int
      then:
        - lambda: |-
            if (timestamp < 1700000000) return;
            timeval value = {timestamp, 0};
            settimeofday(&value, nullptr);
        - script.execute: connect_mqtt
        - component.update: watch_display
        - script.execute: refresh_castkit
    - action: set_image
      variables:
        image_url: string
      then:
        - online_image.set_url:
            id: castkit_image
            url: !lambda return image_url;
            update: true
    - action: show_agenda
      then:
        - lambda: |-
            id(is_binary_clock) = false;
            id(is_scores_page) = false;
            id(is_agenda_page) = true;
            id(is_points_page) = false;
            id(is_timer_page) = false;
            id(agenda_page) = 0;
        - component.update: watch_display
    - action: show_scores
      then:
        - lambda: |-
            if (!${scores_enabled}) return;
            id(is_binary_clock) = false;
            id(is_scores_page) = true;
            id(is_agenda_page) = false;
            id(is_points_page) = false;
            id(is_timer_page) = false;
            id(scores_page) = 0;
        - component.update: watch_display
    - action: show_binary_clock
      then:
        - lambda: |-
            if (!${binary_clock_enabled}) return;
            id(is_binary_clock) = true;
            id(is_scores_page) = false;
            id(is_agenda_page) = false;
            id(is_points_page) = false;
            id(is_timer_page) = false;
        - component.update: watch_display
    - action: show_clock
      then:
        - lambda: id(is_binary_clock) = ${binary_clock_enabled};
        - lambda: id(is_scores_page) = false;
        - lambda: id(is_points_page) = false;
        - lambda: id(is_agenda_page) = false;
        - lambda: id(is_timer_page) = false;
        - component.update: watch_display
    - action: cycle_agenda
      then:
        - lambda: id(last_button_at) = millis();
        - script.execute: cycle_agenda
        - component.update: watch_display
    - action: cycle_scores
      then:
        - lambda: id(last_button_at) = millis();
        - script.execute: cycle_scores
        - component.update: watch_display
    - action: sync_now
      then:
        - script.execute: request_sync
    - action: toggle_clock
      then:
        - lambda: id(last_button_at) = millis();
        - script.execute: cycle_clock
        - component.update: watch_display
    - action: show_castkit
      then:
        - lambda: id(is_binary_clock) = false;
        - lambda: id(is_scores_page) = false;
        - lambda: id(is_points_page) = true;
        - lambda: id(is_agenda_page) = false;
        - script.execute: refresh_castkit
        - component.update: watch_display

# Keep the boot recovery counter out of NVS during frequent sleep wakes.
safe_mode:
  storage: rtc

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      - lambda: id(is_updating) = true;
      - script.stop: battery_cycle
      - deep_sleep.prevent: watch_sleep
    on_error:
      - lambda: id(is_updating) = false;
      - script.execute: battery_cycle
    on_abort:
      - lambda: id(is_updating) = false;
      - script.execute: battery_cycle

mqtt:
  id: mqtt_client
  broker: !secret mqtt_broker
  port: 8883
  username: !secret mqtt_username
  password: !secret mqtt_password
  certificate_authority: !secret mqtt_certificate_authority
  discovery: false
  topic_prefix: ${node_name}/firmware
  enable_on_boot: false
  log_topic: null
  reboot_timeout: 0s
  on_connect:
    # The backend callback precedes the component's connected state.
    - wait_until:
        lambda: return id(mqtt_client).is_connected();
    # Publish during the short battery wake, not only on the 30-second poll.
    - lambda: watchy::network_succeeded(watchy::network_retry);
    - lambda: |-
        auto *wifi_component = wifi::global_wifi_component;
        const int8_t rssi = wifi_component->wifi_rssi();
        const auto bssid = wifi_component->wifi_bssid();
        std::array<char, 33> ssid{};
        wifi_component->wifi_ssid_to(ssid);
        char bssid_text[18];
        snprintf(bssid_text, sizeof(bssid_text), "%02x:%02x:%02x:%02x:%02x:%02x",
          bssid[0], bssid[1], bssid[2], bssid[3], bssid[4], bssid[5]);
        auto now = id(watch_time).now();
        const uint32_t timestamp = now.is_valid() ? now.timestamp : 0;
        const bool is_rescan = watchy::should_rescan(rssi, timestamp, watchy::roam_state);
        if (is_rescan) {
          // An invalid index fails ESPHome's fast-connect load, so the next start scans
          // every channel and joins the strongest configured network.
          wifi::SavedWifiFastConnectSettings forgotten{};
          forgotten.ap_index = -1;
          auto saved = global_preferences->make_preference<wifi::SavedWifiFastConnectSettings>(
            App.get_config_version_hash() + 1, true);
          saved.save(&forgotten);
          watchy::roam_state.last_rescan = timestamp;
        }
        const int channel = wifi_component->get_wifi_channel();
        ESP_LOGI("watchy_network", "Joined %s via %s on channel %d at %d dBm after %u ms%s", ssid.data(),
          bssid_text, channel, rssi, unsigned(millis()), is_rescan ? "; weak, rescanning next sync" : "");
        id(mqtt_client).publish_json("${topic_base}/${device_id}/wifi", [&](JsonObject root) {
          root["ssid"] = ssid.data();
          root["bssid"] = bssid_text;
          root["channel"] = channel;
          root["rssi"] = rssi;
          root["mqttConnectedMs"] = millis();
          root["isRescanNext"] = is_rescan;
        }, 0, true);
    - component.update: battery_voltage
    - script.execute: refresh_castkit
  on_message:
    - topic: ${topic_base}/${device_id}/image_url
      then:
        - if:
            condition:
              lambda: return id(is_points_page);
            then:
              - online_image.set_url:
                  id: castkit_image
                  url: !lambda return x;
                  update: true
  on_json_message:
    - topic: ${scores_state_topic}
      then:
        - lambda: |-
            if (!${scores_enabled}) return;
            auto now = id(watch_time).now();
            if (!watchy::parse_scores(x, id(scores_cache), now.is_valid() ? now.timestamp : 0)) {
              ESP_LOGW("watchy", "Invalid scores snapshot; keeping saved scores.");
              return;
            }
            watchy::record_scores_receipt(x, id(scores_receipt));
            id(has_received_scores) = watchy::scores_sync_complete(id(scores_cache), id(scores_receipt), ${scores_expected_count});
            ESP_LOGI("watchy", "Scores received: %u unique rows; complete: %s", unsigned(id(scores_receipt).count),
              id(has_received_scores) ? "yes" : "no");
        - component.update: saved_scores
        - script.execute: finish_battery_sync
        - if:
            condition:
              lambda: return id(is_scores_page);
            then:
              - component.update: watch_display
    - topic: ${agenda_state_topic}
      then:
        - lambda: |-
            id(has_received_agenda) = true;
            auto now = id(watch_time).now();
            const std::string day = x["date"] | "";
            // Reject an old retained snapshot once the local date is known.
            if (now.is_valid() && day != now.strftime("%Y-%m-%d")) return;
            if (!watchy::parse_agenda(x, id(agenda_cache))) {
              ESP_LOGW("watchy", "Invalid agenda snapshot; keeping the last saved agenda.");
              return;
            }
            id(agenda_page) = std::min(id(agenda_page), std::max(0, (int(id(agenda_cache).count) - 1) / 2));
        - script.execute: finish_battery_sync
        - if:
            condition:
              lambda: return !id(is_points_page);
            then:
              - component.update: watch_display
    - topic: ${timer_state_topic}
      then:
        - lambda: |-
            id(has_received_timer) = true;
            // New sessions and explicit refresh open the timer; routine sync preserves navigation.
            const uint64_t previous_start = id(timer_cache).started_ms;
            watchy::parse_timer(x, id(timer_cache));
            const bool is_active = watchy::timer_running(id(timer_cache));
            if (watchy::should_open_timer(id(timer_cache), previous_start, id(is_timer_sync_requested))) {
              id(is_binary_clock) = false;
              id(is_scores_page) = false;
              id(is_timer_page) = true;
              id(is_points_page) = false;
              id(is_agenda_page) = false;
            }
            id(is_timer_sync_requested) = false;
            if (!is_active && id(is_timer_page)) {
              id(is_timer_page) = false;
              id(is_binary_clock) = ${binary_clock_enabled};
            }
            ESP_LOGI("watchy", "Timer snapshot: %s; banked minutes: %d", is_active ? "running" : "idle",
              int(id(timer_cache).banked_minutes));
        - component.update: watch_display
        - script.execute: finish_battery_sync
        - script.execute: battery_cycle

http_request:
  timeout: 10s
  verify_ssl: true

image:
  - platform: online_image
    id: castkit_image
    url: https://example.com/unused.png
    format: PNG
    type: BINARY
    resize: 200x200
    update_interval: never
    on_download_finished:
      - lambda: id(has_castkit_image) = true;
      - script.execute: finish_battery_sync
      - if:
          condition:
            lambda: return id(is_points_page);
          then:
            - component.update: watch_display
    on_error:
      - logger.log:
          level: WARN
          format: CastKit image unavailable; keeping the local clock usable.

time:
  - platform: sntp
    id: watch_time
    timezone: ${timezone}
    servers:
      - time.cloudflare.com
      - time.google.com
      - pool.ntp.org
    on_time_sync:
      - logger.log: Clock synchronized.
      - script.execute: connect_mqtt
      - if:
          condition:
            lambda: return !id(is_points_page);
          then:
            - component.update: watch_display
      - script.execute: refresh_castkit
    on_time:
      - seconds: 0
        minutes: '*'
        then:
          - if:
              condition:
                lambda: return !id(is_points_page);
              then:
                - component.update: watch_display
  - platform: homeassistant
    id: ha_time
    timezone: ${timezone}
    on_time_sync:
      - logger.log: Clock synchronized from Home Assistant.
      - script.execute: connect_mqtt
      - component.update: watch_display
      - script.execute: refresh_castkit

# Only used once per cold boot to suspend the unused BMA423 accelerometer.
i2c:
  id: sensor_bus
  sda: GPIO12
  scl: GPIO11
  scan: false

spi:
  clk_pin: GPIO47
  mosi_pin: GPIO48

