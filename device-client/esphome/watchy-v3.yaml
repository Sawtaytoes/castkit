# SQFMI Watchy v3: a local clock and a CastKit image page.
# Install with a wrapper overriding the substitutions and providing secrets.
# The watch carries no points rules or child identity: configure its CastKit channel.
substitutions:
  node_name: watchy
  friendly_name: Watchy Display
  device_id: watchy
  topic_base: castkit
  timezone: UTC
  agenda_state_topic: ${topic_base}/${device_id}/agenda/set
  binary_clock_enabled: 'false'
  scores_enabled: 'false'
  scores_state_topic: ${topic_base}/${device_id}/scores/set
  timer_state_topic: ${topic_base}/${device_id}/timer/state
  battery_sync_minutes: '1'

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.1
  includes:
    - <esp_wifi.h>
  on_boot:
    - priority: 1000
      then:
        - lambda: |-
            id(boot_wake_cause) = esp_sleep_get_wakeup_cause();
            id(boot_button_mask) = esp_sleep_get_ext1_wakeup_status();
            id(boot_reset_reason) = esp_reset_reason();
            if (id(boot_reset_reason) != ESP_RST_DEEPSLEEP) watchy::network_retry = {};
    - priority: 600
      then:
        - lambda: |-
            if (id(boot_reset_reason) == ESP_RST_DEEPSLEEP) {
              const auto &saved = watchy::runtime_cache;
              id(agenda_cache) = saved.agenda;
              id(scores_cache) = saved.scores;
              id(timer_cache) = saved.timer;
              id(agenda_page) = saved.agenda_page;
              id(scores_page) = saved.scores_page;
              id(is_binary_clock) = saved.binary;
              id(is_agenda_page) = saved.agenda_selected;
              id(is_scores_page) = saved.scores_selected;
              id(is_points_page) = saved.image_selected;
              id(is_timer_page) = saved.timer_selected;
            }
            ESP_LOGI("watchy", "Restored scores for %s: %u entries", id(scores_cache).day, id(scores_cache).count);
            ESP_LOGI("watchy", "Restored agenda for %s: %u events", id(agenda_cache).day, id(agenda_cache).count);
            const uint64_t buttons = id(boot_button_mask);
            id(up_wake_handled) = buttons & (1ULL << 0);
            if (id(up_wake_handled)) id(cycle_agenda).execute();
            if (buttons & (1ULL << 7)) id(menu_wake_handled) = true;
            if (buttons & (1ULL << 8)) {
              if (id(is_agenda_page)) {
                id(agenda_page) = std::min(id(agenda_page) + 1,
                  std::max(0, (int(id(agenda_cache).count) - 1) / 2));
              } else if (${scores_enabled}) {
                id(is_binary_clock) = false;
                id(is_scores_page) = true;
                id(is_timer_page) = false;
                id(is_points_page) = false;
                id(scores_page) = 0;
              }
              id(down_wake_handled) = true;
            }
            if (buttons & (1ULL << 6)) {
              id(is_binary_clock) = ${binary_clock_enabled};
              id(is_timer_page) = false;
              id(is_scores_page) = false;
              id(is_points_page) = false;
              id(is_agenda_page) = false;
            }
            if (id(is_agenda_page) || id(is_scores_page) || id(is_points_page) || id(is_timer_page))
              id(is_binary_clock) = false;
    - priority: -100
      then:
        - component.update: wake_reason
        - component.update: battery_voltage
        - lambda: |-
            auto now = id(watch_time).now();
            id(network_this_wake) = watchy::network_due({
              id(usb_connected).state, bool(id(boot_button_mask) & (1ULL << 7)),
              id(boot_reset_reason) != ESP_RST_DEEPSLEEP, now.is_valid(), now.minute,
              ${battery_sync_minutes}, now.timestamp}, watchy::network_retry);
            // View buttons draw cached data without starting the radio.
            if (id(boot_wake_cause) == ESP_SLEEP_WAKEUP_EXT1 && !(id(boot_button_mask) & (1ULL << 7))
                && !id(usb_connected).state && now.is_valid()) id(network_this_wake) = false;
        - component.update: watch_display
        - if:
            condition:
              lambda: return id(network_this_wake);
            then:
              - wifi.enable:
              - script.execute: connect_mqtt
              - script.execute: battery_cycle
            else:
              - script.execute: sleep_until_minute
    - priority: -101
      then:
        - delay: 1s
        - lambda: |-
            id(up_wake_handled) = false;
            id(menu_wake_handled) = false;

  on_shutdown:
    - priority: 700
      then:
        - lambda: |-
            auto &saved = watchy::runtime_cache;
            saved.agenda = id(agenda_cache);
            saved.scores = id(scores_cache);
            saved.timer = id(timer_cache);
            saved.agenda_page = id(agenda_page);
            saved.scores_page = id(scores_page);
            saved.binary = id(is_binary_clock);
            saved.agenda_selected = id(is_agenda_page);
            saved.scores_selected = id(is_scores_page);
            saved.image_selected = id(is_points_page);
            saved.timer_selected = id(is_timer_page);

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 8MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_RTC_CLK_SRC_EXT_CRYS: y
      CONFIG_MBEDTLS_HARDWARE_MPI: y
      CONFIG_MBEDTLS_LARGE_KEY_SOFTWARE_MPI: y

external_components:
  - source:
      type: local
      path: components
    components: [watchy_battery, watchy_display]

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  enable_on_boot: false
  fast_connect:
    enabled: true
    storage: rtc
  # Finish short battery transfers quickly; USB uses modem sleep while connected.
  power_save_mode: NONE
  on_connect:
    - lambda: |-
        esp_wifi_set_ps(id(usb_connected).state ? WIFI_PS_MIN_MODEM : WIFI_PS_NONE);
    - script.execute: connect_mqtt
  on_disconnect:
    - mqtt.disable:
        id: mqtt_client
  reboot_timeout: 0s
  ap:
    password: !secret ap_fallback_password

captive_portal:

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key
  actions:
    - action: set_time
      variables:
        timestamp: int
      then:
        - lambda: |-
            if (timestamp < 1700000000) return;
            timeval value = {timestamp, 0};
            settimeofday(&value, nullptr);
        - script.execute: connect_mqtt
        - component.update: watch_display
        - script.execute: refresh_castkit
    - action: set_image
      variables:
        image_url: string
      then:
        - online_image.set_url:
            id: castkit_image
            url: !lambda return image_url;
            update: true
    - action: show_agenda
      then:
        - lambda: |-
            id(is_binary_clock) = false;
            id(is_scores_page) = false;
            id(is_agenda_page) = true;
            id(is_points_page) = false;
            id(is_timer_page) = false;
            id(agenda_page) = 0;
        - component.update: watch_display
    - action: show_scores
      then:
        - lambda: |-
            if (!${scores_enabled}) return;
            id(is_binary_clock) = false;
            id(is_scores_page) = true;
            id(is_agenda_page) = false;
            id(is_points_page) = false;
            id(is_timer_page) = false;
            id(scores_page) = 0;
        - component.update: watch_display
    - action: show_binary_clock
      then:
        - lambda: |-
            if (!${binary_clock_enabled}) return;
            id(is_binary_clock) = true;
            id(is_scores_page) = false;
            id(is_agenda_page) = false;
            id(is_points_page) = false;
            id(is_timer_page) = false;
        - component.update: watch_display
    - action: show_clock
      then:
        - lambda: id(is_binary_clock) = ${binary_clock_enabled};
        - lambda: id(is_scores_page) = false;
        - lambda: id(is_points_page) = false;
        - lambda: id(is_agenda_page) = false;
        - lambda: id(is_timer_page) = false;
        - component.update: watch_display
    - action: show_castkit
      then:
        - lambda: id(is_binary_clock) = false;
        - lambda: id(is_scores_page) = false;
        - lambda: id(is_points_page) = true;
        - lambda: id(is_agenda_page) = false;
        - script.execute: refresh_castkit
        - component.update: watch_display

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      - lambda: id(is_updating) = true;
      - script.stop: battery_cycle
      - deep_sleep.prevent: watch_sleep
    on_error:
      - lambda: id(is_updating) = false;
      - script.execute: battery_cycle
    on_abort:
      - lambda: id(is_updating) = false;
      - script.execute: battery_cycle

mqtt:
  id: mqtt_client
  broker: !secret mqtt_broker
  port: 8883
  username: !secret mqtt_username
  password: !secret mqtt_password
  certificate_authority: !secret mqtt_certificate_authority
  discovery: false
  topic_prefix: ${node_name}/firmware
  enable_on_boot: false
  log_topic: null
  reboot_timeout: 0s
  on_connect:
    # The backend callback precedes the component's connected state.
    - wait_until:
        lambda: return id(mqtt_client).is_connected();
    # Publish during the short battery wake, not only on the 30-second poll.
    - lambda: watchy::network_succeeded(watchy::network_retry);
    - component.update: battery_voltage
    - script.execute: refresh_castkit
  on_message:
    - topic: ${topic_base}/${device_id}/image_url
      then:
        - if:
            condition:
              lambda: return id(is_points_page);
            then:
              - online_image.set_url:
                  id: castkit_image
                  url: !lambda return x;
                  update: true
  on_json_message:
    - topic: ${scores_state_topic}
      then:
        - lambda: |-
            if (!${scores_enabled}) return;
            id(has_received_scores) = true;
            auto now = id(watch_time).now();
            if (!watchy::parse_scores(x, id(scores_cache), now.is_valid() ? now.timestamp : 0)) {
              ESP_LOGW("watchy", "Invalid scores snapshot; keeping saved scores.");
            }
        - script.execute: finish_battery_sync
        - if:
            condition:
              lambda: return id(is_scores_page);
            then:
              - component.update: watch_display
    - topic: ${agenda_state_topic}
      then:
        - lambda: |-
            id(has_received_agenda) = true;
            auto now = id(watch_time).now();
            const std::string day = x["date"] | "";
            // Reject an old retained snapshot once the local date is known.
            if (now.is_valid() && day != now.strftime("%Y-%m-%d")) return;
            if (!watchy::parse_agenda(x, id(agenda_cache))) {
              ESP_LOGW("watchy", "Invalid agenda snapshot; keeping the last saved agenda.");
              return;
            }
            id(agenda_page) = std::min(id(agenda_page), std::max(0, (int(id(agenda_cache).count) - 1) / 2));
        - script.execute: finish_battery_sync
        - if:
            condition:
              lambda: return id(is_agenda_page);
            then:
              - component.update: watch_display
    - topic: ${timer_state_topic}
      then:
        - lambda: |-
            id(has_received_timer) = true;
            // Only a new session takes over the chosen page. Its snapshot survives sleep.
            const uint64_t previous_start = id(timer_cache).started_ms;
            watchy::parse_timer(x, id(timer_cache));
            const bool is_active = watchy::timer_running(id(timer_cache));
            if (is_active && id(timer_cache).started_ms != previous_start) {
              id(is_binary_clock) = false;
              id(is_scores_page) = false;
              id(is_timer_page) = true;
              id(is_points_page) = false;
              id(is_agenda_page) = false;
            }
            if (!is_active && id(is_timer_page)) {
              id(is_timer_page) = false;
              id(is_binary_clock) = ${binary_clock_enabled};
            }
            ESP_LOGI("watchy", "Timer snapshot: %s; banked minutes: %d", is_active ? "running" : "idle",
              int(id(timer_cache).banked_minutes));
        - component.update: watch_display
        - script.execute: finish_battery_sync
        - script.execute: battery_cycle

http_request:
  timeout: 10s
  verify_ssl: true

image:
  - platform: online_image
    id: castkit_image
    url: https://example.com/unused.png
    format: PNG
    type: BINARY
    resize: 200x200
    update_interval: never
    on_download_finished:
      - lambda: id(has_castkit_image) = true;
      - script.execute: finish_battery_sync
      - if:
          condition:
            lambda: return id(is_points_page);
          then:
            - component.update: watch_display
    on_error:
      - logger.log:
          level: WARN
          format: CastKit image unavailable; keeping the local clock usable.

time:
  - platform: sntp
    id: watch_time
    timezone: ${timezone}
    servers:
      - time.cloudflare.com
      - time.google.com
      - pool.ntp.org
    on_time_sync:
      - logger.log: Clock synchronized.
      - script.execute: connect_mqtt
      - if:
          condition:
            lambda: return !id(is_points_page);
          then:
            - component.update: watch_display
      - script.execute: refresh_castkit
    on_time:
      - seconds: 0
        minutes: '*'
        then:
          - if:
              condition:
                lambda: return !id(is_points_page);
              then:
                - component.update: watch_display
  - platform: homeassistant
    id: ha_time
    timezone: ${timezone}
    on_time_sync:
      - logger.log: Clock synchronized from Home Assistant.
      - script.execute: connect_mqtt
      - component.update: watch_display
      - script.execute: refresh_castkit

spi:
  clk_pin: GPIO47
  mosi_pin: GPIO48

font:
  - file:
      type: gfonts
      family: Roboto
      weight: 900
    id: agenda_time_font
    size: 26
    glyphs: '0123456789:apAl dy'
  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: agenda_title_font
    size: 20
    glyphs: ' !"''%()+,-./0123456789:;?ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz'
  - file:
      type: gfonts
      family: Roboto
      weight: 900
    id: clock_font
    size: 56
    glyphs: '0123456789:'
  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: label_font
    size: 18
    glyphs: ' !"''%()+,-./0123456789:;?ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz'
  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: date_font
    size: 28
    glyphs: ' ,-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz'
  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: period_font
    size: 28
    glyphs: 'ap'

  - file:
      type: gfonts
      family: Roboto
      weight: 900
    id: battery_font
    size: 24
    glyphs: '0123456789'

# Data and page choices survive deep sleep in RTC FAST SRAM, never NVS.
globals:
  - id: boot_wake_cause
    type: int
    initial_value: '0'
  - id: boot_button_mask
    type: uint64_t
    initial_value: '0'
  - id: boot_reset_reason
    type: int
    initial_value: '0'
  - id: has_received_agenda
    type: bool
    initial_value: 'false'
  - id: has_received_timer
    type: bool
    initial_value: 'false'
  - id: has_received_scores
    type: bool
    initial_value: 'false'
  - id: is_updating
    type: bool
    initial_value: 'false'
  - id: is_binary_clock
    type: bool
    initial_value: '${binary_clock_enabled}'
  - id: scores_cache
    type: watchy::ScoresCache
    initial_value: 'watchy::ScoresCache{}'
  - id: is_scores_page
    type: bool
    initial_value: 'false'
  - id: scores_page
    type: int
    initial_value: '0'
  - id: agenda_cache
    type: watchy::AgendaCache
    initial_value: 'watchy::AgendaCache{}'
  - id: is_agenda_page
    type: bool
    initial_value: 'false'
  - id: agenda_page
    type: int
    initial_value: '0'
  - id: up_wake_handled
    type: bool
    initial_value: 'false'
  - id: down_wake_handled
    type: bool
    initial_value: 'false'
  - id: menu_wake_handled
    type: bool
    initial_value: 'false'
  - id: is_points_page
    type: bool
    initial_value: 'false'
  - id: has_castkit_image
    type: bool
    initial_value: 'false'
  - id: is_timer_page
    type: bool
    initial_value: 'false'
  - id: timer_cache
    type: watchy::TimerCache
    initial_value: 'watchy::TimerCache{}'
  - id: network_this_wake
    type: bool
    initial_value: 'true'

sensor:
  - platform: watchy_battery
    id: battery_voltage
    internal: true
    update_interval: 30s
    on_value:
      - mqtt.publish_json:
          topic: ${topic_base}/${device_id}/battery
          payload: |-
            root["volts"] = x;
            const bool charging = id(usb_connected).state && id(charger_active).state;
            root["percent"] = watchy::battery_percent(x, id(usb_connected).state, charging);
            root["isCharging"] = charging;
            root["isOnBattery"] = !id(usb_connected).state;
  - platform: wifi_signal
    name: Wi-Fi Signal
    update_interval: 60s

button:
  - platform: restart
    name: Restart
    entity_category: diagnostic

text_sensor:
  - platform: template
    name: Saved Timer
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      const auto &timer = id(timer_cache);
      return watchy::timer_running(timer) ? std::string(timer.name) + "; started " + std::to_string(timer.started_ms)
        + "; banked " + std::to_string(timer.banked_minutes) : std::string("None");
  - platform: template
    id: wake_reason
    name: Wake Reason
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      const auto reason = id(boot_wake_cause);
      if (reason == ESP_SLEEP_WAKEUP_TIMER) return std::string("Minute timer");
      if (reason == ESP_SLEEP_WAKEUP_EXT0) return std::string("USB power");
      if (reason == ESP_SLEEP_WAKEUP_EXT1) {
        const auto buttons = id(boot_button_mask);
        std::string text = "Button:";
        if (buttons & (1ULL << 0)) text += " Up";
        if (buttons & (1ULL << 6)) text += " Back";
        if (buttons & (1ULL << 7)) text += " Menu";
        if (buttons & (1ULL << 8)) text += " Down";
        return text;
      }
      return std::string("Reset / power on; reset reason ") + std::to_string(id(boot_reset_reason));
  - platform: template
    name: Saved Agenda
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      auto &agenda = id(agenda_cache);
      return agenda.day[0] ? std::string(agenda.day) + " (" + std::to_string(agenda.count) + " events)"
        : std::string("Not synced");
  - platform: template
    name: Saved Scores
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      auto &scores = id(scores_cache);
      if (!scores.day[0]) return std::string("Not synced");
      std::string text = scores.day;
      for (int i = 0; i < scores.count; i++) text += "; " + std::string(scores.entries[i].name)
        + " " + std::to_string(scores.entries[i].points);
      return text;
  - platform: wifi_info
    ip_address:
      name: IP Address
      entity_category: diagnostic
  - platform: template
    name: Device Time
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      auto now = id(watch_time).now();
      return now.is_valid() ? now.strftime("%Y-%m-%d %H:%M:%S %Z") : std::string("Not synchronized");

binary_sensor:
  - platform: gpio
    id: charger_active
    name: Charging
    device_class: battery_charging
    entity_category: diagnostic
    pin:
      number: GPIO10
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 2s
    on_state:
      - component.update: battery_voltage
      - component.update: watch_display
  - platform: gpio
    id: usb_connected
    internal: true
    pin: GPIO21
    on_press:
      - deep_sleep.prevent: watch_sleep
      - wifi.enable:
      - lambda: esp_wifi_set_ps(WIFI_PS_MIN_MODEM);
      - script.execute: connect_mqtt
    on_release:
      - lambda: esp_wifi_set_ps(WIFI_PS_NONE);
      - script.execute: battery_cycle
  - platform: gpio
    id: menu_button
    pin:
      number: GPIO7
      allow_other_uses: true
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - lambda: |-
          if (id(menu_wake_handled)) {
            id(menu_wake_handled) = false;
            return;
          }
          if (${binary_clock_enabled}) {
            id(is_binary_clock) = !id(is_binary_clock);
            id(is_scores_page) = false;
            id(is_agenda_page) = false;
            id(is_points_page) = false;
            id(is_timer_page) = false;
          }
      - wifi.enable:
      - script.execute: connect_mqtt
      - component.update: watch_display
  - platform: gpio
    id: back_button
    pin:
      number: GPIO6
      allow_other_uses: true
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - lambda: |-
          id(is_binary_clock) = ${binary_clock_enabled};
          id(is_scores_page) = false;
          id(is_points_page) = false;
          id(is_agenda_page) = false;
          id(is_timer_page) = false;
      - component.update: watch_display
  - platform: gpio
    id: up_button
    pin:
      number: GPIO0
      allow_other_uses: true
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - lambda: |-
          if (id(up_wake_handled)) {
            id(up_wake_handled) = false;
            return;
          }
          id(cycle_agenda).execute();
      - component.update: watch_display
  - platform: gpio
    id: down_button
    pin:
      number: GPIO8
      allow_other_uses: true
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - lambda: |-
          if (id(down_wake_handled)) {
            id(down_wake_handled) = false;
            return;
          }
          if (id(is_agenda_page)) {
            id(agenda_page) = std::min(id(agenda_page) + 1, std::max(0, (int(id(agenda_cache).count) - 1) / 2));
          } else if (${scores_enabled}) {
            if (id(is_scores_page)) id(scores_page) = std::min(id(scores_page) + 1,
              std::max(0, (int(id(scores_cache).count) - 1) / 3));
            else id(scores_page) = 0;
            id(is_binary_clock) = false;
            id(is_scores_page) = true;
            id(is_points_page) = false;
            id(is_timer_page) = false;
          }
      - component.update: watch_display

script:
  - id: cycle_agenda
    then:
      - lambda: |-
          const int last_page = std::max(0, (int(id(agenda_cache).count) - 1) / 2);
          if (id(is_agenda_page) && id(agenda_page) < last_page) id(agenda_page)++;
          else {
            id(is_agenda_page) = !id(is_agenda_page);
            id(agenda_page) = 0;
          }
          id(is_binary_clock) = !id(is_agenda_page) && ${binary_clock_enabled};
          id(is_scores_page) = false;
          id(is_points_page) = false;
          id(is_timer_page) = false;
  # An optional roaming package can prepare its VPN before MQTT starts.
  - id: prepare_network
    mode: restart
    then: []
  - id: connect_mqtt
    mode: restart
    then:
      # DNS before association can waste the entire short wake on a failed lookup.
      - wait_until:
          condition:
            and:
              - wifi.connected:
              - lambda: return id(watch_time).now().is_valid();
      - script.execute: prepare_network
      - script.wait: prepare_network
      - delay: 200ms
      - mqtt.enable:
          id: mqtt_client
  - id: refresh_castkit
    mode: restart
    then:
      # Local pages need only retained state, never a server-rendered image.
      - if:
          condition:
            lambda: return id(is_points_page);
          then:
            # Subscribe before asking for a new single-use URL after each wake.
            - delay: 1s
            - mqtt.publish:
                topic: ${topic_base}/${device_id}/refresh/set
                payload: PRESS
  - id: finish_battery_sync
    mode: restart
    then:
      # Retained rows arrive together. Allow all children and telemetry to flush.
      - delay: 1s
      - if:
          condition:
            lambda: |-
              const bool needs_timer = std::string("${timer_state_topic}") != "${topic_base}/${device_id}/timer/state";
              return !id(usb_connected).state && !id(is_updating)
                && id(battery_voltage).has_state() && id(battery_voltage).state >= 3.35f
                && id(has_received_agenda) && (!needs_timer || id(has_received_timer))
                && (!${scores_enabled} || id(has_received_scores))
                && (!id(is_points_page) || id(has_castkit_image));
          then:
            - script.execute: sleep_until_minute
  - id: sleep_until_minute
    then:
      - lambda: |-
          auto now = id(watch_time).now();
          if (id(network_this_wake) && !id(mqtt_client).is_connected()) {
            watchy::network_failed(watchy::network_retry, now.is_valid() ? now.timestamp : 0, ${battery_sync_minutes});
          }
          ESP_LOGI("watchy_power", "Sleeping after %u ms awake; network wake: %s; retry at %u",
            unsigned(millis()), id(network_this_wake) ? "yes" : "no", unsigned(watchy::network_retry.next_attempt));
      - deep_sleep.enter:
          id: watch_sleep
          sleep_duration: !lambda |-
            if (!id(usb_connected).state && id(battery_voltage).has_state() && id(battery_voltage).state < 3.35f) return 3600000;
            auto now = id(watch_time).now();
            return now.is_valid() ? (60 - now.second) * 1000
              : watchy::retry_minutes(watchy::network_retry, ${battery_sync_minutes}) * 60000;
  - id: battery_cycle
    # Repeated retained-state updates must not postpone an idle sleep deadline.
    mode: single
    then:
      - deep_sleep.prevent: watch_sleep
      - delay: 15s
      - if:
          condition:
            lambda: return !id(usb_connected).state && !id(is_updating) && !id(mqtt_client).is_connected();
          then:
            - delay: 15s
      - if:
          condition:
            lambda: return !id(usb_connected).state && !id(is_updating);
          then:
            # A low cell must not leave old points or a frozen clock on glass.
            - if:
                condition:
                  lambda: return id(battery_voltage).has_state() && id(battery_voltage).state < 3.35f;
                then:
                  - lambda: |-
                      id(is_points_page) = false;
                  - component.update: watch_display
                  - deep_sleep.enter:
                      id: watch_sleep
                      sleep_duration: 1h
                else:
                  - script.execute: sleep_until_minute

interval:
  - interval: 30s
    then:
      - script.execute: battery_cycle
      - if:
          condition:
            lambda: return id(is_points_page) && !id(has_castkit_image);
          then:
            - script.execute: refresh_castkit

deep_sleep:
  id: watch_sleep
  esp32_ext1_wakeup:
    pins:
      - number: GPIO7
        allow_other_uses: true
      - number: GPIO6
        allow_other_uses: true
      - number: GPIO0
        allow_other_uses: true
      - number: GPIO8
        allow_other_uses: true
    mode: ANY_LOW

display:
  - platform: watchy_display
    id: watch_display
    cs_pin: GPIO33
    dc_pin: GPIO34
    reset_pin: GPIO35
    busy_pin: GPIO36
    full_update_every: 30
    update_interval: never
    lambda: |-
      auto now = id(watch_time).now();
      if (id(battery_voltage).has_state() && id(battery_voltage).state < 3.35f && !id(usb_connected).state) {
        it.print(100, 65, id(label_font), TextAlign::CENTER, "Battery low");
        it.print(100, 100, id(label_font), TextAlign::CENTER, "Connect USB");
        return;
      }
      if (id(is_binary_clock)) {
        it.print(6, 4, id(label_font), "Binary");
        if (now.is_valid()) {
          it.print(88, 43, id(label_font), TextAlign::CENTER, "Hour");
          it.print(155, 43, id(label_font), TextAlign::CENTER, "Min");
          for (int bit = 5; bit >= 0; bit--) {
            const int value = 1 << bit;
            const int y = 65 + (5 - bit) * 18;
            it.printf(47, y, id(label_font), TextAlign::CENTER_RIGHT, "%d", value);
            if (bit < 5) {
              it.circle(88, y, 7);
              if (now.hour & value) it.filled_circle(88, y, 6);
            }
            it.circle(155, y, 7);
            if (now.minute & value) it.filled_circle(155, y, 6);
          }
          it.strftime(100, 182, id(label_font), TextAlign::CENTER, "%H:%M", now);
        } else it.print(100, 100, id(label_font), TextAlign::CENTER, "Syncing time...");
      } else if (id(is_scores_page)) {
        it.print(6, 4, id(label_font), "Points");
        auto &scores = id(scores_cache);
        if (!scores.day[0]) {
          it.print(100, 90, id(label_font), TextAlign::CENTER, "Scores not synced");
          it.print(100, 120, id(label_font), TextAlign::CENTER, "Connect to Wi-Fi");
        } else {
          it.print(100, 30, id(label_font), TextAlign::TOP_CENTER, scores.day);
          const int page = std::min(id(scores_page), std::max(0, (int(scores.count) - 1) / 3));
          for (int row = 0; row < 3; row++) {
            const int index = page * 3 + row;
            if (index >= scores.count) break;
            const auto &entry = scores.entries[index];
            std::string name = entry.name;
            int bx, by, width, height;
            while (name.size() > 1) {
              it.get_text_bounds(0, 0, name.c_str(), id(label_font), TextAlign::TOP_LEFT,
                &bx, &by, &width, &height);
              if (width <= 106) break;
              name.pop_back();
            }
            const int y = 66 + row * 40;
            it.print(6, y, id(label_font), TextAlign::CENTER_LEFT, name.c_str());
            it.printf(194, y, id(date_font), TextAlign::CENTER_RIGHT, "%d", int(entry.points));
          }
          const bool current_day = now.is_valid() && now.strftime("%Y-%m-%d") == scores.day;
          it.print(100, 182, id(label_font), TextAlign::CENTER,
            !id(mqtt_client).is_connected() ? "Offline / saved" : current_day ? "Points today" : "Saved day / old");
        }
      } else if (id(is_agenda_page)) {
        auto &agenda = id(agenda_cache);
        const bool is_today = now.is_valid() && now.strftime("%Y-%m-%d") == agenda.day;
        if (!is_today) {
          it.print(100, 90, id(label_font), TextAlign::CENTER, "Agenda not synced");
          it.print(100, 120, id(label_font), TextAlign::CENTER, "Connect to Wi-Fi");
        } else if (agenda.count == 0) {
          it.print(100, 100, id(label_font), TextAlign::CENTER, "No events today");
        } else {
          const int page = std::min(id(agenda_page), (int(agenda.count) - 1) / 2);
          for (int row = 0; row < 2; row++) {
            const int index = page * 2 + row;
            if (index >= agenda.count) break;
            const auto &event = agenda.events[index];
            const int y = 6 + row * 88;
            if (event.all_day) it.print(6, y, id(agenda_time_font), "All day");
            else {
              time_t timestamp = event.start;
              struct tm local{};
              localtime_r(&timestamp, &local);
              it.printf(6, y, id(agenda_time_font), "%d:%02d%s", (local.tm_hour + 11) % 12 + 1,
                local.tm_min, local.tm_hour < 12 ? "a" : "p");
            }
            std::string remaining = event.summary;
            for (int line = 0; line < 2 && !remaining.empty(); line++) {
              size_t length = remaining.size();
              int x, bounds_y, width, height;
              while (length > 0) {
                const std::string candidate = remaining.substr(0, length);
                it.get_text_bounds(0, 0, candidate.c_str(), id(agenda_title_font), TextAlign::TOP_LEFT, &x, &bounds_y, &width, &height);
                if (width <= 188) break;
                length--;
              }
              if (length < remaining.size() && line == 0) {
                const size_t space = remaining.rfind(' ', length);
                if (space != std::string::npos && space > 0) length = space;
              }
              std::string text = remaining.substr(0, length);
              if (line == 1 && length < remaining.size() && length > 3) text = text.substr(0, length - 3) + "...";
              it.print(6, y + 34 + line * 24, id(agenda_title_font), text.c_str());
              remaining.erase(0, length);
              while (!remaining.empty() && remaining.front() == ' ') remaining.erase(0, 1);
            }
          }
          it.printf(100, 176, id(label_font), TextAlign::TOP_CENTER, "%d/%d%s", page + 1,
            (int(agenda.count) + 1) / 2, agenda.omitted ? " + more" : "");
        }
        return;
      } else if (id(is_timer_page) && watchy::timer_running(id(timer_cache)) && now.is_valid()) {
        const auto &timer = id(timer_cache);
        const int elapsed = watchy::elapsed_minutes(timer, now.timestamp);
        const bool countdown = timer.is_countdown && timer.goal_minutes > 0;
        it.print(100, 32, id(label_font), TextAlign::TOP_CENTER, std::string(timer.name).substr(0, 17).c_str());
        it.printf(100, 57, id(clock_font), TextAlign::TOP_CENTER, "%d", watchy::timer_minutes(timer, now.timestamp));
        it.print(100, 120, id(label_font), TextAlign::TOP_CENTER, countdown ? "min left" : "min today");
        it.printf(100, 152, id(label_font), TextAlign::TOP_CENTER, "This run: %d min", elapsed);
      } else if (id(is_points_page) && id(has_castkit_image)) {
        it.image(0, 0, id(castkit_image));
        return;
      } else if (now.is_valid()) {
        auto clock = now.strftime("%I:%M");
        if (clock[0] == '0') clock.erase(0, 1);
        int bounds_x, bounds_y, clock_width, clock_height;
        it.get_text_bounds(0, 0, clock.c_str(), id(clock_font), TextAlign::TOP_LEFT,
                           &bounds_x, &bounds_y, &clock_width, &clock_height);
        const int clock_x = (200 - clock_width - 24) / 2;
        it.print(clock_x, 35, id(clock_font), TextAlign::TOP_LEFT, clock.c_str());
        it.print(clock_x + clock_width + 4, 67, id(period_font), TextAlign::TOP_LEFT, now.hour < 12 ? "a" : "p");
        it.strftime(100, 124, id(date_font), TextAlign::TOP_CENTER, "%a, %b %d", now);
      } else {
        it.print(100, 75, id(label_font), TextAlign::CENTER, "Syncing time...");
      }
      if (id(battery_voltage).has_state()) {
        const bool charging = id(usb_connected).state && id(charger_active).state;
        const int percent = watchy::battery_percent(id(battery_voltage).state, id(usb_connected).state, charging);
        // Plain dark digits avoid small inverse text on the monochrome panel.
        it.printf(194, 4, id(battery_font), TextAlign::TOP_RIGHT, "%d", percent);
        if (charging) {
          // Keep the charging bolt separate from the battery number.
          for (int pixel_y = 8; pixel_y < 24; pixel_y++) {
            for (int pixel_x = 114; pixel_x <= 126; pixel_x++) {
              const bool top = pixel_y <= 16 && pixel_x >= 122 - (pixel_y - 8) && pixel_x <= 122;
              const bool bottom = pixel_y >= 15 && pixel_x >= 118 && pixel_x <= 126 - (pixel_y - 15);
              if (top || bottom) it.draw_pixel_at(pixel_x, pixel_y, COLOR_ON);
            }
          }
        }
      }
