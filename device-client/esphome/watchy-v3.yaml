# SQFMI Watchy v3: a local clock and a CastKit image page.
# Install with a wrapper overriding the substitutions and providing secrets.
# The watch carries no points rules or child identity: configure its CastKit channel.
substitutions:
  node_name: watchy
  friendly_name: Watchy Display
  device_id: watchy
  topic_base: castkit
  timezone: UTC
  agenda_state_topic: ${topic_base}/${device_id}/agenda/set
  timer_state_topic: ${topic_base}/${device_id}/timer/state

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0
  on_boot:
    - priority: 600
      then:
        - lambda: |-
            ESP_LOGI("watchy", "Restored agenda for %s: %u events", id(agenda_cache).day, id(agenda_cache).count);
            const uint64_t buttons = esp_sleep_get_ext1_wakeup_status();
            if (buttons & (1ULL << 7)) {
              if (id(is_agenda_page)) {
                id(is_agenda_page) = false;
                id(is_points_page) = true;
              } else if (id(is_points_page)) {
                id(is_points_page) = false;
              } else {
                id(is_agenda_page) = true;
              }
              id(menu_wake_handled) = true;
            }
            if (buttons & (1ULL << 6)) {
              id(is_points_page) = false;
              id(is_agenda_page) = false;
            }
    - priority: -100
      then:
        - script.execute: battery_cycle
        - delay: 2s
        - component.update: watch_display

preferences:
  flash_write_interval: 0s

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 8MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_RTC_CLK_SRC_EXT_CRYS: y

external_components:
  - source:
      type: local
      path: components
    components: [watchy_battery]

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: LIGHT
  reboot_timeout: 0s
  ap:
    password: !secret ap_fallback_password

captive_portal:

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key
  actions:
    - action: set_time
      variables:
        timestamp: int
      then:
        - lambda: |-
            if (timestamp < 1700000000) return;
            timeval value = {timestamp, 0};
            settimeofday(&value, nullptr);
        - component.update: watch_display
        - script.execute: refresh_castkit
    - action: set_image
      variables:
        image_url: string
      then:
        - online_image.set_url:
            id: castkit_image
            url: !lambda return image_url;
            update: true
    - action: show_agenda
      then:
        - lambda: |-
            id(is_agenda_page) = true;
            id(is_points_page) = false;
            id(is_timer_page) = false;
            id(agenda_page) = 0;
        - component.update: watch_display
    - action: show_clock
      then:
        - lambda: id(is_points_page) = false;
        - lambda: id(is_agenda_page) = false;
        - lambda: id(is_timer_page) = false;
        - component.update: watch_display
    - action: show_castkit
      then:
        - lambda: id(is_points_page) = true;
        - lambda: id(is_agenda_page) = false;
        - script.execute: refresh_castkit
        - component.update: watch_display

ota:
  - platform: esphome
    password: !secret ota_password

mqtt:
  id: mqtt_client
  broker: !secret mqtt_broker
  port: 8883
  username: !secret mqtt_username
  password: !secret mqtt_password
  certificate_authority: !secret mqtt_certificate_authority
  discovery: false
  topic_prefix: ${node_name}/firmware
  reboot_timeout: 0s
  on_connect:
    - script.execute: refresh_castkit
  on_message:
    - topic: ${topic_base}/${device_id}/image_url
      then:
        - online_image.set_url:
            id: castkit_image
            url: !lambda return x;
            update: true
  on_json_message:
    - topic: ${agenda_state_topic}
      then:
        - lambda: |-
            auto now = id(watch_time).now();
            const std::string day = x["date"] | "";
            // Reject an old retained snapshot once the local date is known.
            if (now.is_valid() && day != now.strftime("%Y-%m-%d")) return;
            if (!watchy::parse_agenda(x, id(agenda_cache))) {
              ESP_LOGW("watchy", "Invalid agenda snapshot; keeping the last saved agenda.");
              return;
            }
            id(agenda_page) = std::min(id(agenda_page), std::max(0, (int(id(agenda_cache).count) - 1) / 2));
        - if:
            condition:
              lambda: return id(is_agenda_page);
            then:
              - component.update: watch_display
    - topic: ${timer_state_topic}
      then:
        - lambda: |-
            // Read-only Tally Marks retained state, or the equivalent canonical task.
            JsonObjectConst task = x["activeTask"].is<JsonObjectConst>()
              ? x["activeTask"].as<JsonObjectConst>() : x["runningSession"].as<JsonObjectConst>();
            uint64_t started = task["startedAtMs"] | uint64_t(0);
            if (!started) started = task["startedMs"] | uint64_t(0);
            std::string name = task["name"] | "";
            if (name.empty()) name = task["taskName"] | "";
            const bool is_active = !name.empty() && started > 0;
            if (is_active && started != id(timer_started_ms)) {
              id(is_timer_page) = true;
              id(is_points_page) = false;
              id(is_agenda_page) = false;
            }
            if (!is_active) id(is_timer_page) = false;
            id(has_running_task) = is_active;
            id(timer_started_ms) = started;
            id(timer_name) = name;
            id(timer_goal_minutes) = task["goalMinutes"] | 0.0f;
            id(timer_banked_minutes) = std::max(0, task["bankedMinutes"] | 0);
            id(is_countdown) = task["isCountdown"] | false;
        - component.update: watch_display
        - script.execute: battery_cycle

http_request:
  timeout: 10s
  verify_ssl: true

image:
  - platform: online_image
    id: castkit_image
    url: https://example.com/unused.png
    format: PNG
    type: BINARY
    resize: 200x200
    update_interval: never
    on_download_finished:
      - lambda: id(has_castkit_image) = true;
      - if:
          condition:
            lambda: return id(is_points_page);
          then:
            - component.update: watch_display
    on_error:
      - logger.log:
          level: WARN
          format: CastKit image unavailable; keeping the local clock usable.

time:
  - platform: sntp
    id: watch_time
    timezone: ${timezone}
    servers:
      - time.cloudflare.com
      - time.google.com
      - pool.ntp.org
    on_time_sync:
      - logger.log: Clock synchronized.
      - if:
          condition:
            lambda: return !id(is_points_page);
          then:
            - component.update: watch_display
      - script.execute: refresh_castkit
    on_time:
      - seconds: 0
        minutes: '*'
        then:
          - if:
              condition:
                lambda: return !id(is_points_page);
              then:
                - component.update: watch_display
  - platform: homeassistant
    id: ha_time
    timezone: ${timezone}
    on_time_sync:
      - logger.log: Clock synchronized from Home Assistant.
      - component.update: watch_display
      - script.execute: refresh_castkit

spi:
  clk_pin: GPIO47
  mosi_pin: GPIO48

font:
  - file:
      type: gfonts
      family: Roboto
      weight: 900
    id: clock_font
    size: 56
    glyphs: '0123456789:'
  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: label_font
    size: 18
    glyphs: ' !"%()+,-./0123456789:;?ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz'
  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: date_font
    size: 28
    glyphs: ' ,0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz'
  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: period_font
    size: 28
    glyphs: 'ap'

# Only changes to the saved agenda and page choice write flash, not minute ticks.
globals:
  - id: agenda_cache
    type: watchy::AgendaCache
    restore_value: true
    initial_value: 'watchy::AgendaCache{}'
  - id: is_agenda_page
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: agenda_page
    type: int
    initial_value: '0'
  - id: menu_wake_handled
    type: bool
    initial_value: 'false'
  - id: is_points_page
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: has_castkit_image
    type: bool
    initial_value: 'false'
  - id: is_timer_page
    type: bool
    initial_value: 'false'
  - id: has_running_task
    type: bool
    initial_value: 'false'
  - id: timer_started_ms
    type: uint64_t
    initial_value: '0'
  - id: timer_name
    type: std::string
  - id: timer_goal_minutes
    type: float
    initial_value: '0'
  - id: timer_banked_minutes
    type: int
    initial_value: '0'
  - id: is_countdown
    type: bool
    initial_value: 'false'

sensor:
  - platform: watchy_battery
    id: battery_voltage
    internal: true
    update_interval: 30s
    on_value:
      - mqtt.publish_json:
          topic: ${topic_base}/${device_id}/battery
          payload: |-
            root["volts"] = x;
            const bool charging = id(usb_connected).state && id(charger_active).state;
            root["percent"] = id(usb_connected).state && !charging && x > 4.0f
              ? 100.0f : clamp((x - 3.35f) / 0.85f * 100.0f, 0.0f, charging ? 99.0f : 100.0f);
            root["isCharging"] = charging;
            root["isOnBattery"] = !id(usb_connected).state;
  - platform: wifi_signal
    name: Wi-Fi Signal
    update_interval: 60s

button:
  - platform: restart
    name: Restart
    entity_category: diagnostic

text_sensor:
  - platform: template
    name: Saved Agenda
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      auto &agenda = id(agenda_cache);
      return agenda.day[0] ? std::string(agenda.day) + " (" + std::to_string(agenda.count) + " events)"
        : std::string("Not synced");
  - platform: wifi_info
    ip_address:
      name: IP Address
      entity_category: diagnostic
  - platform: template
    name: Device Time
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      auto now = id(watch_time).now();
      return now.is_valid() ? now.strftime("%Y-%m-%d %H:%M:%S %Z") : std::string("Not synchronized");

binary_sensor:
  - platform: gpio
    id: charger_active
    name: Charging
    device_class: battery_charging
    entity_category: diagnostic
    pin:
      number: GPIO10
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 2s
    on_state:
      - component.update: battery_voltage
      - component.update: watch_display
  - platform: gpio
    id: usb_connected
    internal: true
    pin: GPIO21
    on_press:
      - deep_sleep.prevent: watch_sleep
    on_release:
      - script.execute: battery_cycle
  - platform: gpio
    id: menu_button
    pin:
      number: GPIO7
      allow_other_uses: true
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - lambda: |-
          if (id(menu_wake_handled)) {
            id(menu_wake_handled) = false;
            return;
          }
          if (id(is_agenda_page)) {
            id(is_agenda_page) = false;
            id(is_points_page) = true;
          } else if (id(is_points_page)) {
            id(is_points_page) = false;
          } else {
            id(is_agenda_page) = true;
            id(agenda_page) = 0;
          }
          id(is_timer_page) = false;
      - script.execute: refresh_castkit
      - component.update: watch_display
  - platform: gpio
    id: back_button
    pin:
      number: GPIO6
      allow_other_uses: true
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - lambda: |-
          id(is_points_page) = false;
          id(is_agenda_page) = false;
          id(is_timer_page) = false;
      - component.update: watch_display
  - platform: gpio
    id: up_button
    pin:
      number: GPIO0
      allow_other_uses: true
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - if:
          condition:
            lambda: return id(is_agenda_page);
          then:
            - lambda: id(agenda_page) = std::max(0, id(agenda_page) - 1);
            - component.update: watch_display
          else:
            - script.execute: refresh_castkit
  - platform: gpio
    id: down_button
    pin:
      number: GPIO8
      allow_other_uses: true
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - lambda: |-
          if (id(is_agenda_page)) id(agenda_page) = std::min(id(agenda_page) + 1, std::max(0, (int(id(agenda_cache).count) - 1) / 2));
      - component.update: watch_display

script:
  - id: refresh_castkit
    mode: restart
    then:
      # Subscribe before asking for a new single-use URL after each wake.
      - delay: 1s
      - mqtt.publish:
          topic: ${topic_base}/${device_id}/refresh/set
          payload: PRESS
  - id: battery_cycle
    mode: restart
    then:
      - deep_sleep.prevent: watch_sleep
      - delay: 15s
      - if:
          condition:
            binary_sensor.is_off: usb_connected
          then:
            # A low cell must not leave old points or a frozen clock on glass.
            - if:
                condition:
                  lambda: return id(battery_voltage).has_state() && id(battery_voltage).state < 3.35f;
                then:
                  - lambda: |-
                      id(is_points_page) = false;
                  - component.update: watch_display
                  - deep_sleep.enter:
                      id: watch_sleep
                      sleep_duration: 1h
                else:
                  - if:
                      condition:
                        lambda: return !id(has_running_task) || !id(mqtt_client).is_connected();
                      then:
                        - deep_sleep.enter:
                            id: watch_sleep
                            sleep_duration: !lambda |-
                              auto now = id(watch_time).now();
                              return now.is_valid() ? (60 - now.second) * 1000 : 60000;

interval:
  - interval: 30s
    then:
      - script.execute: battery_cycle
      - if:
          condition:
            lambda: return id(is_points_page) && !id(has_castkit_image);
          then:
            - script.execute: refresh_castkit

deep_sleep:
  id: watch_sleep
  esp32_ext1_wakeup:
    pins:
      - number: GPIO7
        allow_other_uses: true
      - number: GPIO6
        allow_other_uses: true
      - number: GPIO0
        allow_other_uses: true
      - number: GPIO8
        allow_other_uses: true
    mode: ANY_LOW

display:
  - platform: waveshare_epaper
    id: watch_display
    model: 1.54inv2
    cs_pin: GPIO33
    dc_pin: GPIO34
    reset_pin: GPIO35
    busy_pin: GPIO36
    full_update_every: 30
    update_interval: never
    lambda: |-
      auto now = id(watch_time).now();
      if (id(battery_voltage).has_state() && id(battery_voltage).state < 3.35f && !id(usb_connected).state) {
        it.print(100, 65, id(label_font), TextAlign::CENTER, "Battery low");
        it.print(100, 100, id(label_font), TextAlign::CENTER, "Connect USB");
        return;
      }
      if (id(is_agenda_page)) {
        it.print(6, 4, id(label_font), TextAlign::TOP_LEFT, "Agenda");
        if (now.is_valid()) it.strftime(100, 30, id(label_font), TextAlign::TOP_CENTER, "%a, %b %d", now);
        auto &agenda = id(agenda_cache);
        const bool is_today = now.is_valid() && now.strftime("%Y-%m-%d") == agenda.day;
        if (!is_today) {
          it.print(100, 90, id(label_font), TextAlign::CENTER, "Agenda not synced");
          it.print(100, 120, id(label_font), TextAlign::CENTER, "Connect to Wi-Fi");
        } else if (agenda.count == 0) {
          it.print(100, 100, id(label_font), TextAlign::CENTER, "No events today");
        } else {
          const int page = std::min(id(agenda_page), (int(agenda.count) - 1) / 2);
          for (int row = 0; row < 2; row++) {
            const int index = page * 2 + row;
            if (index >= agenda.count) break;
            const auto &event = agenda.events[index];
            const int y = 55 + row * 62;
            if (event.all_day) it.print(6, y, id(label_font), "All day");
            else {
              time_t timestamp = event.start;
              struct tm local{};
              localtime_r(&timestamp, &local);
              it.printf(6, y, id(label_font), "%d:%02d%s", (local.tm_hour + 11) % 12 + 1,
                local.tm_min, local.tm_hour < 12 ? "a" : "p");
            }
            std::string remaining = event.summary;
            for (int line = 0; line < 2 && !remaining.empty(); line++) {
              size_t length = remaining.size();
              int x, bounds_y, width, height;
              while (length > 0) {
                const std::string candidate = remaining.substr(0, length);
                it.get_text_bounds(0, 0, candidate.c_str(), id(label_font), TextAlign::TOP_LEFT, &x, &bounds_y, &width, &height);
                if (width <= 188) break;
                length--;
              }
              if (length < remaining.size() && line == 0) {
                const size_t space = remaining.rfind(' ', length);
                if (space != std::string::npos && space > 0) length = space;
              }
              std::string text = remaining.substr(0, length);
              if (line == 1 && length < remaining.size() && length > 3) text = text.substr(0, length - 3) + "...";
              it.print(6, y + 20 + line * 19, id(label_font), text.c_str());
              remaining.erase(0, length);
              while (!remaining.empty() && remaining.front() == ' ') remaining.erase(0, 1);
            }
          }
          it.printf(100, 176, id(label_font), TextAlign::TOP_CENTER, "%d/%d%s", page + 1,
            (int(agenda.count) + 1) / 2, agenda.omitted ? " + more" : "");
        }
      } else if (id(is_timer_page) && id(has_running_task) && now.is_valid()) {
        const double elapsed = std::max(0.0, (double(now.timestamp) - double(id(timer_started_ms)) / 1000.0) / 60.0);
        const bool countdown = id(is_countdown) && id(timer_goal_minutes) > 0;
        const int minutes = countdown ? std::max(0, int(ceilf(id(timer_goal_minutes) - elapsed)))
          : id(timer_banked_minutes) + int(elapsed);
        it.print(100, 32, id(label_font), TextAlign::TOP_CENTER, id(timer_name).substr(0, 17).c_str());
        it.printf(100, 57, id(clock_font), TextAlign::TOP_CENTER, "%d", minutes);
        it.print(100, 120, id(label_font), TextAlign::TOP_CENTER, countdown ? "min left" : "min today");
        it.printf(100, 152, id(label_font), TextAlign::TOP_CENTER, "This run: %d min", int(elapsed));
      } else if (id(is_points_page) && id(has_castkit_image)) {
        it.image(0, 0, id(castkit_image));
        return;
      } else if (now.is_valid()) {
        auto clock = now.strftime("%I:%M");
        if (clock[0] == '0') clock.erase(0, 1);
        int bounds_x, bounds_y, clock_width, clock_height;
        it.get_text_bounds(0, 0, clock.c_str(), id(clock_font), TextAlign::TOP_LEFT,
                           &bounds_x, &bounds_y, &clock_width, &clock_height);
        const int clock_x = (200 - clock_width - 24) / 2;
        it.print(clock_x, 35, id(clock_font), TextAlign::TOP_LEFT, clock.c_str());
        it.print(clock_x + clock_width + 4, 67, id(period_font), TextAlign::TOP_LEFT, now.hour < 12 ? "a" : "p");
        it.strftime(100, 124, id(date_font), TextAlign::TOP_CENTER, "%a, %b %d", now);
      } else {
        it.print(100, 75, id(label_font), TextAlign::CENTER, "Syncing time...");
      }
      if (id(battery_voltage).has_state()) {
        const bool charging = id(usb_connected).state && id(charger_active).state;
        const int percent = id(usb_connected).state && !charging && id(battery_voltage).state > 4.0f
          ? 100 : int(clamp((id(battery_voltage).state - 3.35f) / 0.85f * 100.0f, 0.0f, charging ? 99.0f : 100.0f));
        it.printf(142, 15, id(label_font), TextAlign::CENTER_RIGHT, "%d%%", percent);
        it.rectangle(152, 5, 38, 20);
        it.filled_rectangle(190, 11, 3, 8);
        const int fill_width = 32 * percent / 100;
        if (fill_width > 0) it.filled_rectangle(155, 8, fill_width, 14);
        if (charging) {
          // Cut the charging bolt through the fill, with contrast at every percentage.
          for (int pixel_y = 8; pixel_y < 22; pixel_y++) {
            for (int pixel_x = 164; pixel_x <= 176; pixel_x++) {
              const bool top = pixel_y <= 15 && pixel_x >= 172 - (pixel_y - 8) && pixel_x <= 172;
              const bool bottom = pixel_y >= 14 && pixel_x >= 168 && pixel_x <= 176 - (pixel_y - 14);
              if (top || bottom) it.draw_pixel_at(pixel_x, pixel_y,
                pixel_x < 155 + fill_width ? COLOR_OFF : COLOR_ON);
            }
          }
        }
      }
