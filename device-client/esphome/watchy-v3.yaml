# Data and page choices survive deep sleep in RTC FAST SRAM, never NVS.
globals:
  - id: boot_wake_cause
    type: int
    initial_value: '0'
  - id: boot_button_mask
    type: uint64_t
    initial_value: '0'
  - id: boot_reset_reason
    type: int
    initial_value: '0'
  - id: has_received_agenda
    type: bool
    initial_value: 'false'
  - id: is_timer_sync_requested
    type: bool
    initial_value: 'false'
  - id: has_received_timer
    type: bool
    initial_value: 'false'
  - id: scores_receipt
    type: watchy::ScoresReceipt
    initial_value: 'watchy::ScoresReceipt{}'
  - id: has_received_scores
    type: bool
    initial_value: 'false'
  - id: is_updating
    type: bool
    initial_value: 'false'
  - id: is_binary_clock
    type: bool
    initial_value: '${binary_clock_enabled}'
  - id: scores_cache
    type: watchy::ScoresCache
    initial_value: 'watchy::ScoresCache{}'
  - id: is_scores_page
    type: bool
    initial_value: 'false'
  - id: scores_page
    type: int
    initial_value: '0'
  - id: agenda_cache
    type: watchy::AgendaCache
    initial_value: 'watchy::AgendaCache{}'
  - id: is_agenda_page
    type: bool
    initial_value: 'false'
  - id: agenda_page
    type: int
    initial_value: '0'
  - id: last_button_at
    type: uint32_t
    initial_value: '0'
  - id: is_points_page
    type: bool
    initial_value: 'false'
  - id: has_castkit_image
    type: bool
    initial_value: 'false'
  - id: is_timer_page
    type: bool
    initial_value: 'false'
  - id: timer_cache
    type: watchy::TimerCache
    initial_value: 'watchy::TimerCache{}'
  - id: network_this_wake
    type: bool
    initial_value: 'true'

sensor:
  - platform: watchy_battery
    id: battery_voltage
    internal: true
    update_interval: 30s
    on_value:
      - mqtt.publish_json:
          topic: ${topic_base}/${device_id}/battery
          payload: |-
            root["volts"] = x;
            const bool charging = id(usb_connected).state && id(charger_active).state;
            root["percent"] = watchy::battery_percent(x, id(usb_connected).state, charging);
            root["isCharging"] = charging;
            root["isOnBattery"] = !id(usb_connected).state;
  - platform: wifi_signal
    name: Wi-Fi Signal
    update_interval: 60s
  # Average awake time per battery wake (application start to sleep entry).
  - platform: template
    id: clock_wake_duration
    name: Clock Wake Duration
    entity_category: diagnostic
    unit_of_measurement: ms
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      if (watchy::wake_stats.local_count == 0) return NAN;
      return float(watchy::wake_stats.local_ms);
  - platform: template
    id: sync_wake_duration
    name: Sync Wake Duration
    entity_category: diagnostic
    unit_of_measurement: ms
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      if (watchy::wake_stats.network_count == 0) return NAN;
      return float(watchy::wake_stats.network_ms);

button:
  - platform: restart
    name: Restart
    entity_category: diagnostic

text_sensor:
  - platform: template
    name: Saved Timer
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      const auto &timer = id(timer_cache);
      return watchy::timer_running(timer) ? std::string(timer.name) + "; started " + std::to_string(timer.started_ms)
        + "; banked " + std::to_string(timer.banked_minutes) : std::string("None");
  - platform: template
    id: wake_reason
    name: Wake Reason
    entity_category: diagnostic
    update_interval: never
    lambda: |-
      const auto reason = id(boot_wake_cause);
      if (reason == ESP_SLEEP_WAKEUP_TIMER) return std::string("Minute timer");
      if (reason == ESP_SLEEP_WAKEUP_EXT0) return std::string("USB power");
      if (reason == ESP_SLEEP_WAKEUP_EXT1) {
        const auto buttons = id(boot_button_mask);
        std::string text = "Button:";
        if (buttons & (1ULL << 0)) text += " Up";
        if (buttons & (1ULL << 6)) text += " Back";
        if (buttons & (1ULL << 7)) text += " Menu";
        if (buttons & (1ULL << 8)) text += " Down";
        return text;
      }
      return std::string("Reset / power on; reset reason ") + std::to_string(id(boot_reset_reason));
  - platform: template
    id: accelerometer_state
    name: Accelerometer
    entity_category: diagnostic
    update_interval: never
    lambda: return std::string(watchy::accel_state_text(watchy::accel_state));
  - platform: template
    name: Saved Agenda
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      auto &agenda = id(agenda_cache);
      return agenda.day[0] ? std::string(agenda.day) + " (" + std::to_string(agenda.count) + " events)"
        : std::string("Not synced");
  - platform: template
    id: saved_scores
    name: Saved Scores
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      auto &scores = id(scores_cache);
      if (!scores.day[0]) return std::string("Not synced");
      std::string text = scores.day;
      for (int i = 0; i < scores.count; i++) text += "; " + std::string(scores.entries[i].name)
        + " " + std::to_string(scores.entries[i].points);
      return text;
  - platform: wifi_info
    ip_address:
      name: IP Address
      entity_category: diagnostic
  - platform: template
    name: Device Time
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      auto now = id(watch_time).now();
      return now.is_valid() ? now.strftime("%Y-%m-%d %H:%M:%S %Z") : std::string("Not synchronized");

binary_sensor:
  - platform: gpio
    id: charger_active
    name: Charging
    device_class: battery_charging
    entity_category: diagnostic
    pin:
      number: GPIO10
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 2s
    on_state:
      - component.update: battery_voltage
      - component.update: watch_display
  - platform: gpio
    id: usb_connected
    internal: true
    pin: GPIO21
    on_press:
      - deep_sleep.prevent: watch_sleep
      - lambda: watchy::boost_cpu(true);
      - wifi.enable:
      - lambda: esp_wifi_set_ps(WIFI_PS_MIN_MODEM);
      - script.execute: connect_mqtt
    on_release:
      - lambda: esp_wifi_set_ps(WIFI_PS_NONE);
      - script.execute: battery_cycle
  - platform: gpio
    id: menu_button
    pin:
      number: GPIO7
      allow_other_uses: true
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_press:
      - lambda: id(last_button_at) = millis();
      - script.execute: cycle_clock
      - component.update: watch_display
      - script.execute: sync_if_menu_held
  - platform: gpio
    id: back_button
    pin:
      number: GPIO6
      allow_other_uses: true
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_press:
      - lambda: |-
          id(last_button_at) = millis();
          id(is_binary_clock) = ${binary_clock_enabled};
          id(is_scores_page) = false;
          id(is_points_page) = false;
          id(is_agenda_page) = false;
          id(is_timer_page) = false;
      - component.update: watch_display
      - script.execute: request_sync
  - platform: gpio
    id: up_button
    pin:
      number: GPIO0
      allow_other_uses: true
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_press:
      - lambda: id(last_button_at) = millis();
      - script.execute: cycle_agenda
      - component.update: watch_display
  - platform: gpio
    id: down_button
    pin:
      number: GPIO8
      allow_other_uses: true
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_press:
      - lambda: id(last_button_at) = millis();
      - script.execute: cycle_scores
      - component.update: watch_display

script:
  - id: sync_if_menu_held
    mode: restart
    then:
      - delay: 2s
      - if:
          condition:
            binary_sensor.is_on: menu_button
          then:
            - script.execute: request_sync
  - id: request_sync
    mode: restart
    then:
      - logger.log: "Manual request: synchronizing cached data."
      - script.stop: sleep_until_minute
      - lambda: |-
          id(is_timer_sync_requested) = true;
          if (!id(mqtt_client).is_connected()) id(has_received_agenda) = false;
          id(has_received_timer) = false;
          id(has_received_scores) = false;
          id(scores_receipt) = {};
          id(network_this_wake) = true;
          watchy::boost_cpu(true);
      - wifi.enable:
      - script.execute: connect_mqtt
      - script.execute: battery_cycle
      - script.execute: request_fresh_state
  - id: request_fresh_state
    mode: restart
    then:
      - if:
          condition:
            lambda: return !std::string("${state_refresh_topic}").empty();
          then:
            - wait_until:
                condition:
                  mqtt.connected:
            - mqtt.publish_json:
                topic: !lambda return std::string("${state_refresh_topic}");
                qos: 1
                retain: false
                payload: |-
                  root["requestId"] = std::string("${node_name}") + "-" + std::to_string(id(watch_time).now().timestamp)
                    + "-" + std::to_string(millis());
  - id: cycle_clock
    then:
      - lambda: |-
          id(is_binary_clock) = ${binary_clock_enabled} && !id(is_binary_clock);
          id(is_scores_page) = false;
          id(is_agenda_page) = false;
          id(is_points_page) = false;
          id(is_timer_page) = false;
  - id: cycle_scores
    then:
      - lambda: |-
          if (!${scores_enabled}) {
            if (id(is_agenda_page)) id(cycle_agenda).execute();
            return;
          }
          const int last_page = std::max(0, (int(id(scores_cache).count) - 1) / 3);
          if (id(is_scores_page) && id(scores_page) < last_page) id(scores_page)++;
          else {
            id(is_scores_page) = !id(is_scores_page);
            id(scores_page) = 0;
          }
          id(is_binary_clock) = !id(is_scores_page) && ${binary_clock_enabled};
          id(is_agenda_page) = false;
          id(is_points_page) = false;
          id(is_timer_page) = false;
  - id: cycle_agenda
    then:
      - lambda: |-
          auto now = id(watch_time).now();
          if (now.is_valid()) watchy::expire_agenda(id(agenda_cache), now.timestamp, now.strftime("%Y-%m-%d"));
          const int last_page = std::max(0, (int(id(agenda_cache).count) - 1) / 2);
          if (id(is_agenda_page) && id(agenda_page) < last_page) id(agenda_page)++;
          else {
            id(is_agenda_page) = !id(is_agenda_page);
            id(agenda_page) = 0;
          }
          id(is_binary_clock) = !id(is_agenda_page) && ${binary_clock_enabled};
          id(is_scores_page) = false;
          id(is_points_page) = false;
          id(is_timer_page) = false;
  # An optional roaming package can prepare its VPN before MQTT starts.
  - id: prepare_network
    mode: restart
    then: []
  - id: connect_mqtt
    mode: restart
    then:
      # DNS before association can waste the entire short wake on a failed lookup.
      - wait_until:
          condition:
            and:
              - wifi.connected:
              - lambda: return id(watch_time).now().is_valid();
      - script.execute: prepare_network
      - script.wait: prepare_network
      - delay: 200ms
      - mqtt.enable:
          id: mqtt_client
  - id: refresh_castkit
    mode: restart
    then:
      # Local pages need only retained state, never a server-rendered image.
      - if:
          condition:
            lambda: return id(is_points_page);
          then:
            # Subscribe before asking for a new single-use URL after each wake.
            - delay: 1s
            - mqtt.publish:
                topic: ${topic_base}/${device_id}/refresh/set
                payload: PRESS
  - id: finish_battery_sync
    mode: restart
    then:
      # Wait for complete scores, then allow queued telemetry to flush.
      - delay: 1s
      - if:
          condition:
            lambda: |-
              const bool needs_timer = std::string("${timer_state_topic}") != "${topic_base}/${device_id}/timer/state";
              return !id(usb_connected).state && !id(is_updating)
                && id(battery_voltage).has_state() && id(battery_voltage).state >= 3.35f
                && id(has_received_agenda) && (!needs_timer || id(has_received_timer))
                && (!${scores_enabled} || id(has_received_scores))
                && (!id(is_points_page) || id(has_castkit_image));
          then:
            - script.execute: sleep_until_minute
  - id: sleep_until_minute
    mode: single
    then:
      - wait_until:
          condition:
            lambda: |-
              return !id(watch_display).is_refreshing()
                && !id(up_button).state && !id(down_button).state
                && !id(menu_button).state && !id(back_button).state
                && (!id(last_button_at) || millis() - id(last_button_at) >= 800);
      - if:
          condition:
            lambda: return !id(usb_connected).state && !id(is_updating);
          then:
            - lambda: |-
                auto now = id(watch_time).now();
                if (id(network_this_wake) && !id(mqtt_client).is_connected()) {
                  watchy::network_failed(watchy::network_retry, now.is_valid() ? now.timestamp : 0, ${battery_sync_minutes});
                }
                watchy::record_wake(watchy::wake_stats, id(network_this_wake), millis());
                ESP_LOGI("watchy_power", "Sleeping after %u ms awake; network wake: %s; retry at %u",
                  unsigned(millis()), id(network_this_wake) ? "yes" : "no", unsigned(watchy::network_retry.next_attempt));
            - deep_sleep.enter:
                id: watch_sleep
                sleep_duration: !lambda |-
                  if (!id(usb_connected).state && id(battery_voltage).has_state() && id(battery_voltage).state < 3.35f) return 3600000;
                  auto now = id(watch_time).now();
                  return now.is_valid() ? (60 - now.second) * 1000
                    : watchy::retry_minutes(watchy::network_retry, ${battery_sync_minutes}) * 60000;
  - id: battery_cycle
    # Repeated retained-state updates must not postpone an idle sleep deadline.
    mode: single
    then:
      - deep_sleep.prevent: watch_sleep
      - delay: 15s
      - if:
          condition:
            lambda: return !id(usb_connected).state && !id(is_updating) && !id(mqtt_client).is_connected();
          then:
            - delay: 15s
      - if:
          condition:
            lambda: return !id(usb_connected).state && !id(is_updating);
          then:
            # A low cell must not leave old points or a frozen clock on glass.
            - if:
                condition:
                  lambda: return id(battery_voltage).has_state() && id(battery_voltage).state < 3.35f;
                then:
                  - lambda: |-
                      id(is_points_page) = false;
                  - component.update: watch_display
                  - script.execute: sleep_until_minute
                else:
                  - script.execute: sleep_until_minute

interval:
  - interval: 30s
    then:
      - script.execute: battery_cycle
      - if:
          condition:
            lambda: return id(is_points_page) && !id(has_castkit_image);
          then:
            - script.execute: refresh_castkit

deep_sleep:
  id: watch_sleep
  esp32_ext1_wakeup:
    pins:
      - number: GPIO7
        allow_other_uses: true
      - number: GPIO6
        allow_other_uses: true
      - number: GPIO0
        allow_other_uses: true
      - number: GPIO8
        allow_other_uses: true
    mode: ANY_LOW

display:
  - platform: watchy_display
    id: watch_display
    cs_pin: GPIO33
    dc_pin: GPIO34
    reset_pin: GPIO35
    busy_pin: GPIO36
    full_update_every: 30
    update_interval: never
    lambda: |-
      auto now = id(watch_time).now();
      if (now.is_valid()) {
        watchy::expire_agenda(id(agenda_cache), now.timestamp, now.strftime("%Y-%m-%d"));
        id(agenda_page) = std::min(id(agenda_page), std::max(0, (int(id(agenda_cache).count) - 1) / 2));
      }
      ESP_LOGI("watchy_view", "View: %s; agenda page: %d; scores page: %d",
        id(is_agenda_page) ? "agenda" : id(is_scores_page) ? "scores" : id(is_timer_page) ? "timer"
          : id(is_points_page) ? "image" : id(is_binary_clock) ? "binary" : "clock",
        id(agenda_page) + 1, id(scores_page) + 1);
      if (id(battery_voltage).has_state() && id(battery_voltage).state < 3.35f && !id(usb_connected).state) {
        it.print(100, 65, id(label_font), TextAlign::CENTER, "Battery low");
        it.print(100, 100, id(label_font), TextAlign::CENTER, "Connect USB");
        return;
      }
      if (id(is_binary_clock)) {
        if (now.is_valid()) {
          it.print(7, 60, id(compact_font), TextAlign::CENTER_LEFT, "h");
          it.print(7, 95, id(compact_font), TextAlign::CENTER_LEFT, "m");
          const int hour = (now.hour + 11) % 12 + 1;
          for (int bit = 5; bit >= 0; bit--) {
            const int value = 1 << bit;
            const int x = 40 + (5 - bit) * 25;
            if (bit == 5 || bit == 3 || bit == 1) {
              it.printf(x, 27, id(compact_font), TextAlign::TOP_CENTER, "%d", value);
            }
            it.circle(x, 60, 9);
            if (hour & value) it.filled_circle(x, 60, 8);
            it.circle(x, 95, 9);
            if (now.minute & value) it.filled_circle(x, 95, 8);
          }
        } else it.print(100, 100, id(label_font), TextAlign::CENTER, "Syncing time...");
      } else if (id(is_scores_page)) {
        auto &scores = id(scores_cache);
        if (!scores.day[0]) {
          it.print(100, 90, id(label_font), TextAlign::CENTER, "Scores not synced");
          it.print(100, 120, id(label_font), TextAlign::CENTER, "Press Back to sync");
        } else {
          const int page = std::min(id(scores_page), std::max(0, (int(scores.count) - 1) / 3));
          for (int row = 0; row < 3; row++) {
            const int index = page * 3 + row;
            if (index >= scores.count) break;
            const auto &entry = scores.entries[index];
            const std::string name = entry.name;
            const std::string initial = name.empty() ? "?" : name.substr(0, 1);
            std::string ending = name.size() > 1 ? name.substr(1) : "";
            const auto points = std::to_string(entry.points);
            int bounds_x, bounds_y, initial_width, height, value_width, ending_width;
            it.get_text_bounds(0, 0, initial.c_str(), id(score_initial_font), TextAlign::TOP_LEFT,
              &bounds_x, &bounds_y, &initial_width, &height);
            it.get_text_bounds(0, 0, points.c_str(), id(score_value_font), TextAlign::TOP_LEFT,
              &bounds_x, &bounds_y, &value_width, &height);
            const int ending_x = 8 + initial_width;
            const int available = 193 - value_width - 7 - ending_x;
            while (!ending.empty()) {
              it.get_text_bounds(0, 0, ending.c_str(), id(compact_font), TextAlign::TOP_LEFT,
                &bounds_x, &bounds_y, &ending_width, &height);
              if (ending_width <= available) break;
              ending.pop_back();
            }
            const int y = 38 + row * 62;
            it.print(7, y, id(score_initial_font), TextAlign::CENTER_LEFT, initial.c_str());
            it.print(ending_x, y + 9, id(compact_font), TextAlign::CENTER_LEFT, ending.c_str());
            // Very large totals must still fit the numeric column.
            auto *const value_font = value_width <= 110 ? id(score_value_font) : id(date_font);
            it.print(193, y, value_font, TextAlign::CENTER_RIGHT, points.c_str());
          }
          if (!now.is_valid() || now.strftime("%Y-%m-%d") != scores.day)
            it.printf(100, 182, id(compact_font), TextAlign::TOP_CENTER, "Saved %s", scores.day);
        }
        return;
      } else if (id(is_agenda_page)) {
        auto &agenda = id(agenda_cache);
        const bool is_today = now.is_valid() && now.strftime("%Y-%m-%d") == agenda.day;
        if (!is_today) {
          it.print(100, 90, id(label_font), TextAlign::CENTER, "Agenda not synced");
          it.print(100, 120, id(label_font), TextAlign::CENTER, "Connect to Wi-Fi");
        } else if (agenda.count == 0) {
          it.print(100, 100, id(label_font), TextAlign::CENTER, "No events today");
        } else {
          const int page = std::min(id(agenda_page), (int(agenda.count) - 1) / 2);
          for (int row = 0; row < 2; row++) {
            const int index = page * 2 + row;
            if (index >= agenda.count) break;
            const auto &event = agenda.events[index];
            const int y = 6 + row * 88;
            if (event.all_day) it.print(6, y, id(agenda_time_font), "All day");
            else {
              time_t timestamp = event.start;
              struct tm local{};
              localtime_r(&timestamp, &local);
              it.printf(6, y, id(agenda_time_font), "%d:%02d%s", (local.tm_hour + 11) % 12 + 1,
                local.tm_min, local.tm_hour < 12 ? "a" : "p");
            }
            std::string remaining = event.summary;
            for (int line = 0; line < 2 && !remaining.empty(); line++) {
              size_t length = remaining.size();
              int x, bounds_y, width, height;
              while (length > 0) {
                const std::string candidate = remaining.substr(0, length);
                it.get_text_bounds(0, 0, candidate.c_str(), id(agenda_title_font), TextAlign::TOP_LEFT, &x, &bounds_y, &width, &height);
                if (width <= 188) break;
                length--;
              }
              if (length < remaining.size() && line == 0) {
                const size_t space = remaining.rfind(' ', length);
                if (space != std::string::npos && space > 0) length = space;
              }
              std::string text = remaining.substr(0, length);
              if (line == 1 && length < remaining.size() && length > 3) text = text.substr(0, length - 3) + "...";
              it.print(6, y + 34 + line * 24, id(agenda_title_font), text.c_str());
              remaining.erase(0, length);
              while (!remaining.empty() && remaining.front() == ' ') remaining.erase(0, 1);
            }
          }
          it.printf(100, 176, id(label_font), TextAlign::TOP_CENTER, "%d/%d%s", page + 1,
            (int(agenda.count) + 1) / 2, agenda.omitted ? " + more" : "");
        }
        return;
      } else if (id(is_timer_page) && watchy::timer_running(id(timer_cache)) && now.is_valid()) {
        const auto &timer = id(timer_cache);
        const int elapsed = watchy::elapsed_minutes(timer, now.timestamp);
        const bool countdown = timer.is_countdown && timer.goal_minutes > 0;
        it.print(100, 32, id(label_font), TextAlign::TOP_CENTER, std::string(timer.name).substr(0, 17).c_str());
        it.printf(100, 57, id(clock_font), TextAlign::TOP_CENTER, "%d", watchy::timer_minutes(timer, now.timestamp));
        it.print(100, 120, id(label_font), TextAlign::TOP_CENTER, countdown ? "min left" : "min today");
        it.printf(100, 152, id(label_font), TextAlign::TOP_CENTER, "This run: %d min", elapsed);
      } else if (id(is_points_page) && id(has_castkit_image)) {
        it.image(0, 0, id(castkit_image));
        return;
      } else if (now.is_valid()) {
        auto clock = now.strftime("%I:%M");
        if (clock[0] == '0') clock.erase(0, 1);
        int bounds_x, bounds_y, clock_width, clock_height;
        it.get_text_bounds(0, 0, clock.c_str(), id(clock_font), TextAlign::TOP_LEFT,
                           &bounds_x, &bounds_y, &clock_width, &clock_height);
        it.print(7, 31, id(clock_font), TextAlign::TOP_LEFT, clock.c_str());
        it.print(7 + clock_width + 4, 59, id(period_font), TextAlign::TOP_LEFT, now.hour < 12 ? "a" : "p");
        it.strftime(7, 91, id(clock_date_font), TextAlign::TOP_LEFT, "%a, %b %d", now);
      } else {
        it.print(100, 75, id(label_font), TextAlign::CENTER, "Syncing time...");
      }
      if (now.is_valid() && !id(is_scores_page) && !id(is_timer_page) && !id(is_points_page)) {
        const auto &agenda = id(agenda_cache);
        const auto day = now.strftime("%Y-%m-%d");
        const int divider_y = 120;
        it.line(7, divider_y, 193, divider_y);
        const int index = watchy::next_agenda_event(agenda, now.timestamp, day);
        if (index >= 0) {
          const auto &event = agenda.events[index];
          it.print(7, divider_y + 14, id(compact_font), event.all_day ? "Today"
            : event.start <= now.timestamp ? "Now" : "Next");
          if (!event.all_day) {
            time_t timestamp = event.start;
            struct tm local{};
            localtime_r(&timestamp, &local);
            it.printf(193, divider_y + 10, id(agenda_time_font), TextAlign::TOP_RIGHT, "%d:%02d%s",
              (local.tm_hour + 11) % 12 + 1, local.tm_min, local.tm_hour < 12 ? "a" : "p");
          }
          std::string remaining = event.summary;
          for (int line = 0; line < 2 && !remaining.empty(); line++) {
            size_t length = remaining.size();
            int bounds_x, bounds_y, width, height;
            while (length > 0) {
              const auto candidate = remaining.substr(0, length);
              it.get_text_bounds(0, 0, candidate.c_str(), id(next_title_font), TextAlign::TOP_LEFT,
                &bounds_x, &bounds_y, &width, &height);
              if (width <= 186) break;
              length--;
            }
            if (length < remaining.size() && line == 0) {
              const auto space = remaining.rfind(' ', length);
              if (space != std::string::npos && space > 0) length = space;
            }
            std::string text = remaining.substr(0, length);
            if (line == 1 && length < remaining.size() && length > 3) text = text.substr(0, length - 3) + "...";
            it.print(7, divider_y + 37 + line * 21, id(next_title_font), text.c_str());
            remaining.erase(0, length);
            while (!remaining.empty() && remaining.front() == ' ') remaining.erase(0, 1);
          }
        } else it.print(7, divider_y + 18, id(next_title_font),
          day != agenda.day ? "Agenda not synced" : "No more today");
      }
      if (id(battery_voltage).has_state()) {
        const bool charging = id(usb_connected).state && id(charger_active).state;
        const int level = watchy::battery_bars(id(battery_voltage).state);
        it.rectangle(172, 5, 20, 11);
        it.filled_rectangle(192, 8, 3, 5);
        for (int bar = 0; bar < level; bar++) it.filled_rectangle(175 + bar * 5, 8, 3, 5);
        if (charging) {
          // The bolt sits beside the compact bars, never over them.
          it.line(167, 4, 162, 10);
          it.line(162, 10, 168, 10);
