# --- Buses ------------------------------------------------------------------
spi:
  clk_pin: GPIO14
  mosi_pin: GPIO12
  miso_pin: GPIO13

i2c:
  sda: GPIO21
  scl: GPIO22
  frequency: 100khz

# M5Paper power latch (external component). Holds the main-power rail on so the
# panel stays awake on battery. Owns GPIO2/GPIO5 — don't redeclare them.
m5paper:
  battery_power_pin: GPIO5
  main_power_pin: GPIO2

# HTTP client used by online_image to pull the render. CastKit is served over
# https with an internal cert, so skip cert verification on the ESP32.
http_request:
  timeout: 10s
  verify_ssl: false

# The pushed render. CastKit dithers to 1-bit black/white, so BINARY is exact
# for the mono panel. The URL here is a placeholder; it's overwritten live by the
# MQTT `image_url` subscription (or the `set_image` API fallback). When the
# download finishes we do a full (slow) refresh for a clean, ghost-free frame.
#
# ⚠️ ORIENTATION IS A THREE-WAY CONTRACT — all three must agree, or the frame
# shrinks instead of filling the panel:
#   1. The panel's `width`/`height` in CastKit's device registry — decides the
#      RENDER size, and is the box every view lays itself out in. 960x540 here.
#   2. `display: rotation:` below — decides the CANVAS size. COMPILE-TIME.
#   3. `resize:` here — must equal that canvas. COMPILE-TIME.
# ESPHome scales to FIT, preserving aspect (runtime_image.cpp:
# `scale = min(fixed_w/w, fixed_h/h)`), so a mismatch never errors — it silently
# letterboxes. A 960x540 render into a 540x960 resize scales by 0.5625, i.e. a
# 540x303 strip on a 960-tall panel. Because 2 and 3 are compile-time, ROTATING
# THIS PANEL REQUIRES A REFLASH, not just the MQTT knob.
#
# ⚠️ The `castkit/m5paper/rotation` knob is NOT part of that contract, and it
# cannot stand in for item 1. It turns the finished bitmap and never re-runs
# the layout. Registering the panel 540x960 and setting the knob to 90 produced
# a correctly-sized 960x540 frame carrying a PORTRAIT composition on its side,
# with the time and date running off the edge — which is what the panel showed
# from 2026-07-27 until 2026-09-11. Keep this knob on 0 or 180; 180 is the flip
# to reach for when the frame lands upside-down.
online_image:
  - id: now_playing_image
    url: "http://192.0.2.1/placeholder.png"
    format: png
    type: BINARY
    # Landscape: matches `display: rotation: 0` and the registry's 960x540.
    resize: 960x540
    on_download_finished:
      - lambda: id(m5paper_display).update_slow();
    on_error:
      - logger.log: "CastKit render fetch failed"

# --- Display ----------------------------------------------------------------
display:
  - platform: it8951e
    id: m5paper_display
    cs_pin: GPIO15
    reset_pin: GPIO23
    reset_duration: 100ms
    busy_pin: GPIO27
    model: M5EPD
    # The panel is natively 960x540 LANDSCAPE, so rotation 0 = 960x540 canvas
    # (rotation 90 would present it as portrait 540x960 — that was the config
    # until 2026-07-27, when the panel was rotated to landscape).
    # Must match `resize:` above and CastKit's rotation knob — see the
    # three-way contract there.
    # If the frame lands upside-down, flip CastKit's rotation knob 0 <-> 180
    # (retained MQTT, no reflash) before touching this.
    rotation: 0
    reversed: false
    # Never auto-refresh: ePaper holds the last frame at zero power. We repaint
    # only when HA pushes a new render (on_download_finished above).
    update_interval: never
    lambda: |-
      // Blit the pushed render 1:1. On the mono panel COLOR_ON = black ink,
      // COLOR_OFF = white paper.
      //
      // The colour args look backwards ON PURPOSE — do not "fix" them.
      // ESPHome decodes a `type: BINARY` online_image with
      // `is_color_on(color)` = luminance > 127 (runtime_image.cpp), so a BRIGHT
      // source pixel sets the bit, and a set bit is painted with the FIRST
      // colour arg (image.cpp). That convention suits a backlit display where
      // "on" = lit; on ePaper "on" is black INK, so passing COLOR_ON first
      // paints white pixels black and renders every frame as a negative.
      // Mapping bright -> COLOR_OFF (white paper) is what makes it a positive.
      it.image(0, 0, id(now_playing_image), COLOR_OFF, COLOR_ON);

      // --- Fast-update music progress bar (EXPERIMENTAL) --------------------
      // it8951e supports a FAST refresh via id(m5paper_display).update() (vs the
      // full-flash .update_slow()), so a thin now-playing bar can repaint
      // locally without re-pushing the card. Uncomment + drive from an HA
      // number/sensor once you've confirmed the fast path looks right.
      //
      // if (id(media_duration).state > 0) {
      //   int bar_y = it.get_height() - 8;
      //   float fraction = id(media_position).state / id(media_duration).state;
      //   int filled = (int)(it.get_width() * fraction);
      //   it.filled_rectangle(0, bar_y, filled, 8, COLOR_ON);
      // }

# --- Touch (DISABLED for first flash) ---------------------------------------
# GT911 capacitive touch is MAINLINE, but ESPHome regressed the GT911 reset to
# drive the interrupt pin as an OUTPUT, which fails on the M5Paper's input-only
# GPIO36 (esphome/esphome#14953, seen on 2026.3.0+). Left commented so the first
# flash compiles cleanly; re-enable once the base panel is confirmed working
# (and the GPIO36 handling is verified on your ESPHome version).
#
# touchscreen:
#   - platform: gt911
#     id: gt911_touchscreen
#     display: m5paper_display
#     interrupt_pin: GPIO36
#     on_touch:
#       - lambda: |-
#           char buffer[32];
#           sprintf(buffer, "(%d, %d)", touch.x, touch.y);
#           id(touch_coordinates).publish_state(buffer);
#
# text_sensor:
#   - platform: template
#     name: "Touch Coordinates"
#     id: touch_coordinates

# --- Battery ----------------------------------------------------------------
# The M5Paper is the ONLY display in the fleet with a cell, and until this block
# existed nothing anywhere could read it — not CastKit, not Home Assistant, not
# the panel itself. See docs/decisions/
# 2026-09-13-a-battery-is-a-panel-fact-a-power-source-is-an-installation-and-charge-is-telemetry.md
#
# ⚠️ NOTHING HERE TAKES EFFECT UNTIL THE PANEL IS RE-FLASHED. The node is already
# ESPHome; it simply declared no sensors.
#
# ⚠️ THE VOLTAGE IS UNCALIBRATED ON THIS UNIT. The battery sits on GPIO35 behind
# an on-board divider, and `multiply: 2.0` is the nominal 1:1 ratio — not a
# measured one. The ESP32's ADC is also non-linear near the rails. On the first
# flash, compare `Battery voltage` against a meter across the cell and adjust the
# multiplier before anyone trusts `Battery`. Publish the VOLTS regardless: they
# are the honest reading and they survive a wrong percentage curve.
sensor:
  - platform: adc
    id: battery_voltage
    name: "Battery voltage"
    pin: GPIO35
    attenuation: 12db
    device_class: voltage
    unit_of_measurement: V
    accuracy_decimals: 2
    # Five minutes, not five seconds. This panel exists to be read across a
    # room; a battery curve does not need a fast sample, and each wake costs
    # the very charge it is measuring.
    update_interval: 300s
    filters:
      - multiply: 2.0
      - median:
          window_size: 5
          send_every: 5
          send_first_at: 3

  - platform: template
    id: battery_percent
    name: "Battery"
    device_class: battery
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 300s
    # A flat linear map between an empty and a full LiPo. It is deliberately
    # crude: a real discharge curve is not linear, and inventing one before the
    # voltage itself is calibrated would be false precision. Replace it with a
    # measured curve once the panel has run a cell down once.
    lambda: |-
      const float empty_volts = 3.20f;
      const float full_volts = 4.20f;
      float volts = id(battery_voltage).state;
      if (isnan(volts)) { return {}; }
      float fraction = (volts - empty_volts) / (full_volts - empty_volts);
      if (fraction < 0.0f) { fraction = 0.0f; }
      if (fraction > 1.0f) { fraction = 1.0f; }
      return fraction * 100.0f;

# CastKit owns this panel's Home Assistant discovery (`discovery: false` above),
# so the battery reaches the house as ONE retained CastKit topic rather than as
# three ESPHome entities on a second device. CastKit republishes it as a
# `device_class: battery` sensor on the display it already owns.
interval:
  - interval: 300s
    then:
      - mqtt.publish_json:
          topic: castkit/m5paper/battery
          retain: true
          payload: |-
            root["volts"] = id(battery_voltage).state;
            root["percent"] = id(battery_percent).state;
            root["isOnBattery"] = id(is_on_battery).state;

# --- Buttons and battery state (read by Home Assistant) ---------------------
binary_sensor:
  # The three hardware buttons down the edge of the M5Paper (active-low).
  - platform: gpio
    name: "Button: Left"
    pin:
      number: GPIO39
      inverted: true
  - platform: gpio
    name: "Button: Center"
    pin:
      number: GPIO38
      inverted: true
  - platform: gpio
    name: "Button: Right"
    pin:
      number: GPIO37
      inverted: true

  - platform: template
    id: is_on_battery
    name: "On battery"
    device_class: plug
    # ⚠️ INFERRED, NOT MEASURED. The M5Paper exposes no VBUS sense line through
    # the vendored component, so there is no honest way to ask "is mains
    # present". This is a proxy on the cell voltage and nothing more.
    #
    # ⚠️ It cannot detect a power cut quickly, and it is not supposed to try.
    # The first version of this test used 4.10 V, on the assumption that a
    # charger holds the cell at its ceiling. Measured on 2026-09-14, that is
    # wrong: the charger stops at full and lets the cell rest at 4.13-4.14 V,
    # which is 0.03 V above that threshold. A resting voltage falls as a cell
    # ages, so the old test was going to read "on battery" on a panel that has
    # never been unplugged. A false `true` is expensive — CastKit drops a
    # display one repaint grade on it and eventually marks the glass.
    #
    # So the test now fires well below any resting voltage, with hysteresis so
    # it cannot chatter at the boundary. What it really means is "the cell has
    # been carrying this panel for a while". The firmware never sleeps, so an
    # unplugged panel reaches 3.95 V in a few hours and still has a few hours
    # left. Replace the whole thing the day a real sense line is wired.
    lambda: |-
      const float on_battery_volts = 3.95f;
      const float back_on_mains_volts = 4.05f;
      float volts = id(battery_voltage).state;
      if (isnan(volts)) { return {}; }
      if (id(is_on_battery).state) { return volts < back_on_mains_volts; }
      return volts < on_battery_volts;
