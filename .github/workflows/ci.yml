name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Every job carries a `timeout-minutes`. Without one a job inherits GitHub's
# 6-hour ceiling, and a hang is then indistinguishable from a slow queue for
# six hours — reporting `cancelled`, a conclusion that reads like
# infrastructure rather than like a broken build. It costs a concurrency slot
# the whole time, and it takes the deploy with it: `docker-deploy` below
# `needs: [typecheck, unit-tests]`, so a job that never concludes success
# SKIPS the deploy rather than failing it. A skipped deploy logs as a no-op,
# not as a missed release.
#
# That is not hypothetical. The sibling repo queuepilot had four runs stall
# inside `playwright install --with-deps` on 2026-08-19 and sit until the 6h
# cap; mux-magic bounded its own jobs for the same reason (its #226). This
# repo installs the same browser the same way and had no bound anywhere.
#
# The values are ceilings, NOT targets: ~5-10x each job's observed green
# duration (unit-tests ~1-2.5min, lint/typecheck/storybook under a minute,
# docker-deploy ~2min). Raise one only if a job legitimately grows into it.

jobs:
  # Decide whether this change is documentation only.
  #
  # Nothing below reads markdown. There is no markdownlint, no remark, no
  # prettier over `.md` and no link check anywhere in this fleet, and Biome
  # does not format markdown. So a `.md`-only diff makes every gate below run
  # without ever opening the file that changed.
  #
  # WARNING: this job must run on EVERY event, and the gates below must be
  # turned off with `if:` rather than with `paths-ignore:` on the trigger.
  # Branch protection requires these jobs by name. A job that `if:` skips still
  # reports its context: GitHub records the conclusion `skipped` and counts it
  # as success, and Forgejo posts `skipped` and keeps the combined state green
  # (verified on portly-controllers#17, which merged with `CI / check
  # (pull_request)` skipped). A workflow that never STARTED posts nothing at
  # all, so a required check stays pending and the pull request can never
  # merge, with no failure to explain why.
  changes:
    runs-on: ubuntu-latest

    outputs:
      isDocsOnly: ${{ steps.detect.outputs.isDocsOnly }}

    steps:
      - uses: actions/checkout@v7
        # The full history: the diff below needs the base commit present.
        with: { fetch-depth: 0 }

      - id: detect
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          # Fail SAFE. Anything we cannot diff -- a workflow_dispatch, a tag, a
          # new branch whose `before` is all zeros, a base commit the fetch
          # missed -- runs the whole suite rather than skipping it.
          if [ -z "${BASE_SHA:-}" ] \
            || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null
          then
            echo "No usable base commit -- running every gate."
            echo "isDocsOnly=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mergeBase="$(git merge-base "${BASE_SHA}" HEAD || echo "${BASE_SHA}")"
          changedFiles="$(git diff --name-only "${mergeBase}" HEAD)"
          printf 'Changed files:\n%s\n\n' "${changedFiles}"

          isDocsOnly=true

          if [ -z "${changedFiles}" ]
          then
            isDocsOnly=false
          elif printf '%s\n' "${changedFiles}" | grep -q '^\.changeset/'
          then
            # A changeset file is markdown, but it is a RELEASE input rather
            # than documentation. Treat it as code.
            isDocsOnly=false
          elif printf '%s\n' "${changedFiles}" | grep -qvE '^(.+\.md|LICENSE)$'
          then
            # `.mdx` deliberately does NOT match `.md$` -- it is Storybook
            # source in several repos here, and it compiles.
            isDocsOnly=false
          fi

          echo "isDocsOnly=${isDocsOnly}"
          echo "isDocsOnly=${isDocsOnly}" >> "$GITHUB_OUTPUT"

  lint:
    needs: [changes]
    # Skipped, not absent: this still posts its status context.
    if: ${{ needs.changes.outputs.isDocsOnly != 'true' }}
    # Biome + the house ESLint rules from @charcuterie/eslint-config. `check`
    # and `eslint .` without `--write`/`--fix`: the repo's `lint` script
    # rewrites the tree, which in CI would report success on code that never
    # existed in the commit.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version-file: .nvmrc }
      - run: npm install --global corepack@latest && corepack enable
      - run: yarn install --immutable
      - run: yarn lint:biome
      - run: yarn lint:eslint

  typecheck:
    needs: [changes]
    # Skipped, not absent: this still posts its status context.
    if: ${{ needs.changes.outputs.isDocsOnly != 'true' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version-file: .nvmrc }
      # Node 26 unbundled corepack, so a bare `corepack enable` is exit-127
      # there; install it first (the fleet's charcuterie-node-base does the same).
      - run: npm install --global corepack@latest && corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck

  unit-tests:
    needs: [changes]
    # Skipped, not absent: this still posts its status context.
    if: ${{ needs.changes.outputs.isDocsOnly != 'true' }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version-file: .nvmrc }
      # Node 26 unbundled corepack, so a bare `corepack enable` is exit-127
      # there; install it first (the fleet's charcuterie-node-base does the same).
      - run: npm install --global corepack@latest && corepack enable
      - run: yarn install --immutable

      # SPLIT, and bounded a second time here at the step. The stall in the
      # header is an APT stall, not a Playwright one: `--with-deps` shells out
      # to apt-get, and that is the half that hangs.
      #
      # So the apt half is best-effort — ubuntu-latest already ships the
      # libraries chromium needs, and a dead Ubuntu mirror must not be able to
      # block this repo's CI. The BROWSER half comes from Playwright's own CDN
      # and is the part `vitest --browser` actually needs, so it runs on its
      # own and must succeed.
      #
      # Deliberately not `yarn install-playwright-browser`: that script stays
      # the plain `--with-deps` one-liner for local dev, because `timeout` is
      # coreutils and doesn't exist on the Windows side of this fleet.
      - name: Install chromium
        timeout-minutes: 15
        run: |
          DEBIAN_FRONTEND=noninteractive timeout 300 yarn playwright install-deps chromium \
            || echo "playwright install-deps failed or timed out (apt mirror?) — continuing; the runner image ships chromium's libs"
          timeout 600 yarn playwright install chromium

      - run: yarn test

  storybook:
    needs: [changes]
    # Skipped, not absent: this still posts its status context.
    if: ${{ needs.changes.outputs.isDocsOnly != 'true' }}
    # **Nothing checked that the Storybook still builds, and the artifacts lie.**
    #
    # `storybook build` writes `index.json` and `iframe.html` even when it FAILS
    # partway, so a broken build is byte-indistinguishable from a working one and
    # the only signal is the exit code — which a `run:` step propagates, and which
    # is the entire reason this job exists. mux-magic's Storybook sat broken on two
    # branches for exactly that reason (MDX importing `@storybook/blocks`, removed
    # in Storybook 9) while still producing a plausible static site.
    #
    # It matters here beyond the repo: `storybook.octen.dev` composes this build as
    # a ref (`storybook-container/refs.json` → `packages/web`), and its `build.sh`
    # answers a failed ref by keeping the PREVIOUS output and logging a warning
    # nobody reads. A Storybook that stops building does not disappear from the
    # composed sidebar; it silently goes stale.
    #
    # Deliberately NOT in `docker-deploy`'s `needs`: Storybook is a dev preview and
    # is not in the runtime image. The views it renders are already covered for the
    # deploy by `typecheck` + `unit-tests`, so a story-only or `.storybook`-only
    # break should show as its own red check without holding back the server image.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version-file: .nvmrc }
      # Node 26 unbundled corepack, so a bare `corepack enable` is exit-127
      # there; install it first (the fleet's charcuterie-node-base does the same).
      - run: npm install --global corepack@latest && corepack enable
      - run: yarn install --immutable
      - run: yarn build:storybook
      - run: yarn build:storybook:slatecast

      # The sibling false-green: a build that SUCCEEDS with an empty index, because
      # a `stories:` glob (in either `.storybook/main.ts`) stopped matching after a
      # move. Nothing errors and the site still serves — it just has no stories in
      # it, and the composed sidebar shows an empty section. A floor, not a count:
      # it catches the glob dropping out, not each story added.
      - name: Assert the Storybook indexes are not empty
        run: |
          set -euo pipefail
          assert_floor() {
            local label="$1" index="$2" floor="$3"
            local count
            count="$(node -p "Object.keys(require('${index}').entries).length")"
            echo "${label} Storybook indexed ${count} entries."
            if [ "$count" -lt "$floor" ]; then
              echo "::error::${label} Storybook indexed ${count} entries (floor is ${floor}) — has a stories glob stopped matching?"
              exit 1
            fi
          }
          assert_floor "ePaper (web)" "./packages/web/storybook-static/index.json" 20
          assert_floor "browser (slatecast)" "./packages/slatecast/storybook-static/index.json" 8

  docker-deploy:
    # Build + push the runtime image to GHCR; TrueNAS pulls it from there.
    needs: [typecheck, unit-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t ghcr.io/sawtaytoes/castkit:latest \
            -t ghcr.io/sawtaytoes/castkit:${{ github.sha }} \
            .

      - name: Push image
        run: |
          # The old inkcast image stays frozen at its pre-rename tag until the
          # fleet topic migration retires the inkcast TrueNAS app.
          docker push ghcr.io/sawtaytoes/castkit:latest
          docker push ghcr.io/sawtaytoes/castkit:${{ github.sha }}
